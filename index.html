<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>워크플로우 빌더</title>
<style>
/* ═══ 최신 CSS 리빌드 — 디자인 토큰 + 현대 색상 공간 ═══ */
@layer reset, tokens, layout, components, utilities;

@layer tokens {
  :root {
    /* oklch 색상 공간 — 더 넓은 색 영역 */
    --bg: oklch(0.965 0.005 260);
    --surface: oklch(1 0 0);
    --surface-2: oklch(0.98 0.004 260);
    --border: oklch(0.92 0.006 260);
    --border-strong: oklch(0.85 0.01 260);
    --text: oklch(0.22 0.02 260);
    --text-dim: oklch(0.5 0.015 260);
    --text-faint: oklch(0.62 0.015 260);
    /* 브랜드 색상 */
    --accent: oklch(0.55 0.19 255);      /* 파랑 */
    --accent-soft: color-mix(in oklch, var(--accent) 12%, white);
    --danger: oklch(0.58 0.2 25);
    --danger-soft: color-mix(in oklch, var(--danger) 10%, white);
    /* 노드 타입별 */
    --n-start: oklch(0.62 0.17 155);
    --n-process: oklch(0.55 0.19 255);
    --n-decision: oklch(0.7 0.15 75);
    --n-end: oklch(0.58 0.2 25);
    /* 크기 토큰 */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 3px color-mix(in oklch, black 8%, transparent);
    --shadow-md: 0 4px 16px color-mix(in oklch, black 12%, transparent);
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --topbar-h: 52px; --sidebar-w: 240px; --inspector-w: 280px;
    --font: system-ui, 'Pretendard', -apple-system, sans-serif;
  }
}

@layer reset {
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  button,input,textarea{font:inherit;color:inherit}
}

@layer layout {
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    height:100dvh;               /* 동적 뷰포트 — 모바일 주소창 대응 */
    display:flex;flex-direction:column;overflow:hidden;
    scrollbar-gutter:stable;
  }
  #topbar{
    height:var(--topbar-h);
    background:var(--surface);
    border-block-end:1px solid var(--border);
    display:flex;align-items:center;
    padding-inline:var(--space-4);  /* logical property */
    gap:var(--space-3);flex-shrink:0;
    position:relative;z-index:20;
    backdrop-filter:blur(12px);    /* 유리 효과 */
    background:color-mix(in oklch, var(--surface) 85%, transparent);
  }
  #app{flex:1;display:flex;min-height:0}
  #sidebar{
    width:var(--sidebar-w);
    background:var(--surface);
    border-inline-end:1px solid var(--border);
    flex-shrink:0;display:flex;flex-direction:column;
  }
  #canvas-wrap{
    flex:1;position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 20% 30%, color-mix(in oklch, var(--accent) 4%, transparent), transparent 40%),
      var(--bg);
    container-type:inline-size;   /* Container Query 앵커 */
  }
  #canvas{position:absolute;inset:0}
  #inspector{
    width:var(--inspector-w);
    background:var(--surface);
    border-inline-start:1px solid var(--border);
    flex-shrink:0;overflow-y:auto;
  }
}

@layer components {
  /* 사이드바 */
  #wf-list{list-style:none;padding:var(--space-2);overflow-y:auto;flex:1}
  #wf-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:var(--space-2) var(--space-3);
    border-radius:var(--radius-sm);
    cursor:pointer;font-size:14px;margin-block-end:var(--space-1);
    transition:background .15s ease, translate .15s ease;
  }
  #wf-list li:hover{background:var(--surface-2)}
  #wf-list li.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #wf-list .wf-del{border:none;background:none;font-size:16px;color:var(--text-faint);cursor:pointer;padding-inline:var(--space-1)}
  #wf-list .wf-del:hover{color:var(--danger)}
  #add-wf{
    margin:var(--space-2) var(--space-3);
    padding:var(--space-3);
    border:1px dashed var(--border-strong);
    border-radius:var(--radius-md);
    background:none;cursor:pointer;font-size:14px;
    transition:border-color .15s, background .15s;
  }
  #add-wf:hover{border-color:var(--accent);background:var(--accent-soft)}

  /* 노드 — 개별 translate 속성 + :has() */
  #canvas .node{
    position:absolute;min-width:160px;padding:10px 14px;
    background:var(--surface);
    border:2px solid var(--border);
    border-radius:var(--radius-md);
    cursor:grab;user-select:none;
    display:flex;align-items:center;gap:var(--space-2);
    box-shadow:var(--shadow-sm);
    z-index:1;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  #canvas .node:hover{border-color:var(--border-strong)}
  #canvas .node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  /* :has() — 드래그 중(노드 내부 포트 활성)인 부모 강조 */
  #canvas .node:has(.nport:active){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  #canvas .node .nicon{
    width:26px;height:26px;border-radius:var(--radius-sm);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:14px;flex-shrink:0;
    aspect-ratio:1;             /* 정사각형 보장 */
  }
  #canvas .node .nlabel{
    font-size:14px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-wrap:balance;           /* 최신 텍스트 균형 */
  }
  #canvas .node .nport{
    position:absolute;inset-inline-end:-4px;top:50%;translate:0 -50%;
    width:18px;height:18px;border-radius:50%;
    background:var(--accent);border:3px solid var(--surface);
    cursor:crosshair;opacity:0;transition:opacity .15s, scale .15s;
    z-index:5;pointer-events:auto;
  }
  #canvas .node:hover .nport{opacity:1}
  #canvas .node .nport:hover{scale:1.3}   /* 개별 scale 속성 */

  /* 엣지 */
  #edges{position:absolute;inset:0;pointer-events:none;z-index:0}
  #edges line{pointer-events:stroke}

  /* 인스펙터 */
  #inspector h3{font-size:14px;padding:14px var(--space-4) var(--space-2);border-block-end:1px solid var(--border)}
  #inspector-body{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
  #inspector label{font-size:12px;color:var(--text-dim);margin-block-start:var(--space-2)}
  #inspector input,#inspector textarea{
    width:100%;padding:var(--space-2);
    border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:13px;font-family:inherit;
    transition:border-color .15s, box-shadow .15s;
  }
  #inspector input:focus-visible,#inspector textarea:focus-visible{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);
  }
  #inspector button{margin-block-start:var(--space-3);padding:9px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px}
  #f-del-node,#f-del-edge{background:var(--danger-soft);color:var(--danger)}

  /* 컨텍스트 메뉴 */
  #ctx-menu{
    position:fixed;display:none;z-index:50;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-md);
    padding:var(--space-1);
    backdrop-filter:blur(8px);
    background:color-mix(in oklch, var(--surface) 92%, transparent);
  }
  #ctx-menu button{
    display:block;width:100%;text-align:left;
    padding:var(--space-2) var(--space-3);
    border:none;background:none;cursor:pointer;font-size:13px;border-radius:var(--radius-sm);
    transition:background .12s;
  }
  #ctx-menu button:hover{background:var(--surface-2)}
}

@layer utilities {
  /* 상단바 버튼 공용 */
  #topbar button{
    padding:7px 14px;border:1px solid var(--border);
    border-radius:var(--radius-sm);background:var(--surface);
    cursor:pointer;font-size:13px;
    transition:border-color .15s, background .15s, translate .15s;
  }
  #topbar button:hover{border-color:var(--accent);background:var(--accent-soft)}
  #topbar button:active{translate:0 1px}
  #topbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Container Query — 인스펙터/사이드바가 좁아지면 폭 자동 조절 */
  @container (max-width: 480px){
    #canvas .node{min-width:130px;padding:8px 10px}
    #canvas .node .nlabel{font-size:12px}
  }

  /* 반응형 — 미디어 쿼리 유지 (모바일 토글) */
  @media(max-width:900px){
    #sidebar{position:absolute;z-index:10;height:100%;translate:-100% 0;transition:translate .2s ease}
    #sidebar.open{translate:0 0}
    #inspector{position:absolute;inset-inline-end:0;z-index:10;height:100%;translate:100% 0;transition:translate .2s ease}
    #inspector.open{translate:0 0}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
}
</style>
</head>
<body>
  <header id="topbar">
    <button id="sidebar-toggle">☰</button>
    <strong>워크플로우 빌더</strong>
    <input id="wf-name" placeholder="워크플로우 이름" style="flex:1;max-width:300px">
    <span id="save-status" style="font-size:12px;color:#888"></span>
    <span id="sync-status" style="font-size:12px;color:#888"></span>
    <button id="btn-export" style="margin-left:auto;padding:7px 14px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;font-size:13px">내보내기</button>
    <button id="btn-import" style="padding:7px 14px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;font-size:13px">가져오기</button>
    <input type="file" id="file-import" accept=".json,application/json" style="display:none">
  </header>
  <div id="ctx-menu"></div>
  <div id="app">
    <aside id="sidebar">
      <button id="add-wf">+ 새 워크플로우</button>
      <ul id="wf-list"></ul>
    </aside>
    <main id="canvas-wrap">
      <svg id="edges"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8a8f98"/></marker></defs></svg>
      <div id="canvas"></div>
    </main>
    <aside id="inspector">
      <h3>속성</h3>
      <div id="inspector-body"></div>
    </aside>
  </div>
<script>
// 마이그레이션 대비: 같은 도메인 하위 슬러그에서도 기존 사이트와
// localStorage 충돌 없이 독립 동작하도록 경로 기반 키 사용
const LS_KEY = 'wf_app_' + (location.pathname.split('/').filter(Boolean).join('_') || 'root');
// 백업 키 (JSON 파손 대비)
const LS_BACKUP_KEY = LS_KEY + '_backup';

// === 서버 연동 (옵션) ===
// 서버가 있으면(localhost:3737 등) 자동 사용, 없으면 localStorage만으로 동작
const API_BASE = (window.__WF_API__ || 'http://localhost:3737');
let serverOnline = false;
let syncTimer = null;

async function checkServer() {
  try {
    const r = await fetch(API_BASE + '/api/workflows', { signal: AbortSignal.timeout(2500) });
    serverOnline = r.ok;
  } catch (e) { serverOnline = false; }
  updateSyncStatus();
  return serverOnline;
}

function updateSyncStatus() {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.textContent = serverOnline ? '서버 연결됨' : '로컬 저장';
  el.style.color = serverOnline ? '#1a7f37' : '#888';
}

// 서버에서 전체 워크플로우 로드 (성공 시 store 대체)
async function loadFromServer() {
  if (!(await checkServer())) return false;
  try {
    const r = await fetch(API_BASE + '/api/workflows');
    const j = await r.json();
    if (!j.success) return false;
    const list = j.workflows || [];
    if (list.length === 0) return false;
    const loaded = [];
    for (const item of list) {
      const d = await (await fetch(API_BASE + '/api/workflows/' + item.id)).json();
      if (d.success && d.workflow) {
        const wf = d.workflow.data || {};
        if (Array.isArray(wf.nodes) && Array.isArray(wf.edges)) {
          loaded.push({ id: d.workflow.id, name: d.workflow.name, nodes: wf.nodes, edges: wf.edges });
        }
      }
    }
    if (loaded.length > 0) {
      store.workflows = loaded;
      store.activeWorkflowId = loaded[0].id;
      return true;
    }
  } catch (e) { console.warn('server load failed', e); }
  return false;
}

// 서버에 전체 워크플로우 동기화 (디바운스)
function syncToServer() {
  if (!serverOnline) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      for (const wf of store.workflows) {
        await fetch(API_BASE + '/api/workflows/' + encodeURIComponent(wf.id), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: wf.name, data: { nodes: wf.nodes, edges: wf.edges } }),
        });
      }
    } catch (e) { console.warn('server sync failed', e); }
  }, 800);
}
let store = { workflows: [], activeWorkflowId: null };
let saveTimer = null;

function defaultWorkflow(name) {
  const id = 'wf_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  return {
    id, name,
    nodes: [
      { id: 'n_' + Date.now().toString(36) + 'a', type: 'start', x: 80, y: 100, label: '시작', desc: '', assignee: '', due: '', tags: [] },
      { id: 'n_' + Date.now().toString(36) + 'b', type: 'end', x: 80, y: 340, label: '종료', desc: '', assignee: '', due: '', tags: [] }
    ],
    edges: []
  };
}

function loadStore() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      store = JSON.parse(raw);
      if (!Array.isArray(store.workflows)) store.workflows = [];
      if (store.workflows.length === 0) {
        const wf = defaultWorkflow('새 워크플로우');
        store.workflows.push(wf);
        store.activeWorkflowId = wf.id;
      }
      if (!store.workflows.find(w => w.id === store.activeWorkflowId)) {
        store.activeWorkflowId = store.workflows[0].id;
      }
    } else {
      const wf = defaultWorkflow('새 워크플로우');
      store.workflows = [wf];
      store.activeWorkflowId = wf.id;
    }
  } catch (e) {
    console.warn('load failed', e);
    // 백업에서 복구 시도
    try {
      const backup = localStorage.getItem(LS_BACKUP_KEY);
      if (backup) {
        store = JSON.parse(backup);
        if (!Array.isArray(store.workflows)) store.workflows = [];
      }
    } catch (e2) { console.warn('backup load failed', e2); }
    if (!store.workflows || store.workflows.length === 0) {
      const wf = defaultWorkflow('새 워크플로우');
      store = { workflows: [wf], activeWorkflowId: wf.id };
    }
  }
}

function saveStore(immediate) {
  clearTimeout(saveTimer);
  const write = () => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(store));
      localStorage.setItem(LS_BACKUP_KEY, JSON.stringify(store));
      const el = document.getElementById('save-status');
      if (el) { el.textContent = '저장됨'; setTimeout(() => el.textContent = '', 2000); }
    } catch (e) {
      const el = document.getElementById('save-status');
      if (el) el.textContent = '⚠ 저장 실패 (localStorage 불가)';
    }
  };
  if (immediate) { write(); }
  else saveTimer = setTimeout(write, 500);
  syncToServer();
}

function currentWorkflow() {
  return store.workflows.find(w => w.id === store.activeWorkflowId) || null;
}

// === Sidebar ===
function renderSidebar() {
  const ul = document.getElementById('wf-list');
  ul.innerHTML = '';
  store.workflows.forEach(wf => {
    const li = document.createElement('li');
    li.textContent = wf.name;
    li.className = wf.id === store.activeWorkflowId ? 'active' : '';
    li.dataset.id = wf.id;
    li.addEventListener('click', () => {
      store.activeWorkflowId = wf.id;
      document.getElementById('wf-name').value = wf.name;
      renderAll(); saveStore();
    });
    const del = document.createElement('button');
    del.textContent = '×';
    del.className = 'wf-del';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm('워크플로우를 삭제할까요?')) return;
      store.workflows = store.workflows.filter(w => w.id !== wf.id);
      if (store.activeWorkflowId === wf.id) {
        store.activeWorkflowId = store.workflows[0]?.id || null;
      }
      renderAll(); saveStore(true);
    });
    li.appendChild(del);
    ul.appendChild(li);
  });
}

document.getElementById('add-wf').addEventListener('click', () => {
  const wf = defaultWorkflow('새 워크플로우 ' + (store.workflows.length + 1));
  store.workflows.push(wf);
  store.activeWorkflowId = wf.id;
  document.getElementById('wf-name').value = wf.name;
  renderAll(); saveStore(true);
});

function renderAll() {
  renderSidebar();
  renderCanvas();
  renderInspector();
}

// === Canvas ===
const NODE_TYPES = {
  start:    { color: '#2ea043', icon: '▶', label: '시작' },
  process:  { color: '#1f6feb', icon: '▢', label: '프로세스' },
  decision: { color: '#d29922', icon: '◇', label: '판단' },
  end:      { color: '#d1242f', icon: '●', label: '종료' }
};
let selected = { type: null, id: null };

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderCanvas() {
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = '';
  renderEdges();
  const wf = currentWorkflow();
  if (!wf) return;
  wf.nodes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'node type-' + n.type + (selected.type === 'node' && selected.id === n.id ? ' sel' : '');
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.dataset.id = n.id;
    el.innerHTML = `<span class="nicon" style="background:${NODE_TYPES[n.type].color}">${NODE_TYPES[n.type].icon}</span>
      <span class="nlabel">${escapeHtml(n.label || NODE_TYPES[n.type].label)}</span>
      <span class="nport" data-port="out"></span>`;
    el.addEventListener('mousedown', (e) => startDrag(e, n));
    el.addEventListener('click', (e) => { e.stopPropagation(); selectNode(n.id); });
    canvas.appendChild(el);
  });
}

function selectNode(id) {
  selected = { type: 'node', id };
  renderAll();
}

function startDrag(e, node) {
  e.preventDefault();
  selected = { type: 'node', id: node.id };
  const startX = e.clientX, startY = e.clientY;
  const origX = node.x, origY = node.y;
  function move(ev) {
    node.x = origX + (ev.clientX - startX);
    node.y = origY + (ev.clientY - startY);
    const el = document.querySelector(`#canvas .node[data-id="${node.id}"]`);
    if (el) { el.style.left = node.x + 'px'; el.style.top = node.y + 'px'; }
    renderEdges();
  }
  function up() {
    window.removeEventListener('mousemove', move);
    window.removeEventListener('mouseup', up);
    saveStore();
  }
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
}

// === EdgeLayer ===
function renderEdges() {
  const svg = document.getElementById('edges');
  svg.innerHTML = '';
  const wf = currentWorkflow();
  if (!wf) return;
  wf.edges.forEach(e => {
    const from = wf.nodes.find(n => n.id === e.from);
    const to = wf.nodes.find(n => n.id === e.to);
    if (!from || !to) { console.warn('orphan edge', e.id); return; }
    const x1 = from.x + 90, y1 = from.y + 26;
    const x2 = to.x + 90, y2 = to.y + 26;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', '#8a8f98'); line.setAttribute('stroke-width', '2');
    line.setAttribute('marker-end', 'url(#arrow)');
    line.dataset.id = e.id;
    line.style.cursor = 'pointer';
    line.addEventListener('click', (ev) => { ev.stopPropagation(); selected = { type: 'edge', id: e.id }; renderAll(); });
    svg.appendChild(line);
    if (e.label) {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', (x1+x2)/2); t.setAttribute('y', (y1+y2)/2 - 6);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '12');
      t.setAttribute('fill', '#d29922'); t.setAttribute('font-weight', 'bold');
      t.textContent = e.label;
      svg.appendChild(t);
    }
  });
}

// 연결 드래그: 노드의 out 핸들에서 시작
let connectFrom = null;
document.addEventListener('mousedown', (e) => {
  const port = e.target.closest('.nport');
  if (!port) return;
  e.preventDefault(); e.stopPropagation();
  const fromId = port.closest('.node').dataset.id;
  connectFrom = fromId;
  function up(ev) {
    const target = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.node');
    if (target && target.dataset.id !== fromId) {
      const wf = currentWorkflow();
      const existing = wf.edges.filter(e2 => e2.from === fromId);
      const isDecision = wf.nodes.find(n => n.id === fromId)?.type === 'decision';
      const label = isDecision ? (existing.length === 0 ? 'Yes' : 'No') : '';
      wf.edges.push({ id: 'e_' + Date.now().toString(36), from: fromId, to: target.dataset.id, label });
      saveStore(); renderAll();
    }
    connectFrom = null;
    window.removeEventListener('mousemove', move);
    window.removeEventListener('mouseup', up);
  }
  function move(ev) {}
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
});

// === Inspector ===
function renderInspector() {
  const body = document.getElementById('inspector-body');
  body.innerHTML = '';
  const wf = currentWorkflow();
  if (!wf) { body.innerHTML = '<p>워크플로우 없음</p>'; return; }
  if (selected.type === 'node') {
    const n = wf.nodes.find(x => x.id === selected.id);
    if (!n) return;
    body.innerHTML = `
      <label>이름</label><input id="f-label" value="${escapeHtml(n.label)}">
      <label>설명</label><textarea id="f-desc">${escapeHtml(n.desc)}</textarea>
      <label>담당자</label><input id="f-assignee" value="${escapeHtml(n.assignee)}">
      <label>기한</label><input id="f-due" type="date" value="${escapeHtml(n.due)}">
      <label>태그 (콤마 구분)</label><input id="f-tags" value="${escapeHtml((n.tags||[]).join(', '))}">
      <button id="f-del-node">노드 삭제</button>`;
    ['label','desc','assignee','due'].forEach(k => {
      document.getElementById('f-' + k).addEventListener('input', (e) => { n[k] = e.target.value; saveStore(); });
    });
    document.getElementById('f-tags').addEventListener('input', (e) => {
      n.tags = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
      saveStore();
    });
    document.getElementById('f-del-node').addEventListener('click', () => {
      wf.nodes = wf.nodes.filter(x => x.id !== n.id);
      wf.edges = wf.edges.filter(x => x.from !== n.id && x.to !== n.id);
      selected = { type: null, id: null };
      saveStore(true); renderAll();
    });
  } else if (selected.type === 'edge') {
    const e = wf.edges.find(x => x.id === selected.id);
    if (!e) return;
    body.innerHTML = `<label>라벨 (분기)</label><input id="f-ec-label" value="${escapeHtml(e.label||'')}">
      <button id="f-del-edge">연결 삭제</button>`;
    document.getElementById('f-ec-label').addEventListener('input', (ev) => { e.label = ev.target.value; saveStore(); renderEdges(); });
    document.getElementById('f-del-edge').addEventListener('click', () => {
      wf.edges = wf.edges.filter(x => x.id !== e.id);
      selected = { type: null, id: null };
      saveStore(true); renderAll();
    });
  } else {
    body.innerHTML = `<label>워크플로우 이름</label><input id="f-wf-name" value="${escapeHtml(wf.name)}">`;
    document.getElementById('f-wf-name').addEventListener('input', (e) => {
      wf.name = e.target.value;
      document.getElementById('wf-name').value = wf.name;
      renderSidebar(); saveStore();
    });
  }
}

// === 컨텍스트 메뉴 (노드 추가) ===
const ctxMenu = document.getElementById('ctx-menu');
const canvasEl = document.getElementById('canvas');
canvasEl.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (e.target.closest('.node')) return;
  ctxMenu.style.display = 'block';
  ctxMenu.style.left = e.clientX + 'px';
  ctxMenu.style.top = e.clientY + 'px';
  ctxMenu.dataset.x = e.offsetX;
  ctxMenu.dataset.y = e.offsetY;
});
document.addEventListener('click', () => ctxMenu.style.display = 'none');
Object.keys(NODE_TYPES).forEach(t => {
  const btn = document.createElement('button');
  btn.textContent = NODE_TYPES[t].icon + ' ' + NODE_TYPES[t].label;
  btn.addEventListener('click', () => {
    const wf = currentWorkflow();
    wf.nodes.push({
      id: 'n_' + Date.now().toString(36), type: t,
      x: +ctxMenu.dataset.x - 80, y: +ctxMenu.dataset.y - 20,
      label: NODE_TYPES[t].label, desc: '', assignee: '', due: '', tags: []
    });
    ctxMenu.style.display = 'none';
    saveStore(); renderAll();
  });
  ctxMenu.appendChild(btn);
});

document.getElementById('canvas').addEventListener('click', () => {
  selected = { type: null, id: null };
  renderAll();
});

// === 내보내기 / 가져오기 ===
document.getElementById('btn-export').addEventListener('click', () => {
  const payload = { app: 'workflow-builder', version: 1, exported_at: new Date().toISOString(), data: store };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const wf = currentWorkflow();
  const fname = (wf && wf.name ? wf.name.replace(/[^\w가-힣]+/g, '_') : 'workflow') + '_' + new Date().toISOString().slice(0,10) + '.json';
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
});

document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('file-import').click();
});
document.getElementById('file-import').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      const imported = parsed && parsed.data && parsed.data.workflows ? parsed.data : parsed;
      if (!Array.isArray(imported.workflows) || imported.workflows.length === 0) {
        throw new Error('워크플로우 데이터 없음');
      }
      // ID 충돌 방지: 가져온 데이터의 ID를 새로 부여
      const idMap = {};
      imported.workflows.forEach(w => {
        const newWfId = 'wf_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
        idMap[w.id] = newWfId;
        w.id = newWfId;
        w.nodes.forEach(n => {
          const newN = 'n_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
          idMap[n.id] = newN; n.id = newN;
        });
        w.edges.forEach(ed => {
          ed.id = 'e_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
          ed.from = idMap[ed.from] || ed.from;
          ed.to = idMap[ed.to] || ed.to;
        });
      });
      store.workflows = store.workflows.concat(imported.workflows);
      store.activeWorkflowId = imported.workflows[imported.workflows.length-1].id;
      saveStore(true); renderAll();
      const wfc = currentWorkflow();
      if (wfc) document.getElementById('wf-name').value = wfc.name;
      alert('가져오기 완료: ' + imported.workflows.length + '개 워크플로우 추가');
    } catch (err) {
      alert('가져오기 실패: ' + err.message);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

// === 키보드 삭제 ===
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected.id) {
    e.preventDefault();
    const wf = currentWorkflow();
    if (selected.type === 'node') {
      wf.nodes = wf.nodes.filter(n => n.id !== selected.id);
      wf.edges = wf.edges.filter(x => x.from !== selected.id && x.to !== selected.id);
    } else if (selected.type === 'edge') {
      wf.edges = wf.edges.filter(x => x.id !== selected.id);
    }
    selected = { type: null, id: null };
    saveStore(true); renderAll();
  }
});

// === 모바일 토글 ===
document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

// === 상단 워크플로우명 연동 ===
document.getElementById('wf-name').addEventListener('input', (e) => {
  const wf = currentWorkflow();
  if (wf) { wf.name = e.target.value; renderSidebar(); saveStore(); }
});

// === 초기화 ===
loadStore();
const wf0 = currentWorkflow();
if (wf0) document.getElementById('wf-name').value = wf0.name;
renderAll();
// 서버 연동 — 서버에 데이터가 있으면 로드, 없으면 로컬 유지
(async () => {
  const loaded = await loadFromServer();
  if (loaded) {
    const wf1 = currentWorkflow();
    if (wf1) document.getElementById('wf-name').value = wf1.name;
    renderAll();
    saveStore(true);
  }
})();
</script>
