<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>워크플로우 빌더</title>
<style>
/* ═══ 최신 CSS 리빌드 — 디자인 토큰 + 현대 색상 공간 ═══ */
@layer reset, tokens, layout, components, utilities;

/* Isamanru font (noonnu free commercial, GongGames) */
@font-face {
  font-family: 'Isamanru';
  src: url('fonts/Isamanru-Light.woff') format('woff');
  font-weight: 300;
  font-display: swap;
}
@font-face {
  font-family: 'Isamanru';
  src: url('fonts/Isamanru-Medium.woff') format('woff');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Isamanru';
  src: url('fonts/Isamanru-Bold.woff') format('woff');
  font-weight: 700;
  font-display: swap;
}

@layer tokens {
  :root {
    /* ── 강조색: #00ff87 민트 그린 ── */
    --accent: #00ff87;
    --accent-strong: #00d46f;
    --accent-soft: rgba(0,255,135,.14);
    --accent-glow: rgba(0,255,135,.35);

    /* ── 다크 / 화이트 교차 팔레트 ── */
    --dark: #0a0d10;
    --dark-2: #12161b;
    --dark-3: #1a2027;
    --dark-border: #232a33;
    --light: #f7f8fa;
    --light-2: #ffffff;
    --light-border: #e2e5ea;

    /* 전면 다크: 모든 패널 + 캔버스 통일 */
    --panel-bg: var(--dark);
    --panel-bg-2: var(--dark-2);
    --panel-border: var(--dark-border);
    --panel-text: #e8eaed;
    --panel-text-dim: #9aa3ad;
    --panel-text-faint: #6b7681;

    --canvas-bg: var(--dark);
    --canvas-grid: color-mix(in srgb, var(--accent) 7%, transparent);
    --dot: rgba(255,255,255,.035);  /* 도트 그리드 — 매우 낮은 대비 */

    /* 노드 (다크 캔버스 위 = 다크 카드) */
    --node-bg: var(--dark-2);
    --node-border: var(--dark-border);
    --node-text: #e8eaed;

    /* 공용 */
    --danger: #ff5d5d;
    --danger-soft: rgba(255,93,93,.12);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.1);
    --shadow-md: 0 6px 24px rgba(0,0,0,.28);
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --topbar-h: 52px; --sidebar-w: 240px; --inspector-w: 280px;
    --font: 'Isamanru', system-ui, -apple-system, sans-serif;
  }
}

@layer reset {
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  button,input,textarea{font:inherit;color:inherit}
}

@layer layout {
  body{
    font-family:var(--font);
    background:var(--dark);
    color:var(--panel-text);
    height:100dvh;
    display:flex;flex-direction:column;overflow:hidden;
    scrollbar-gutter:stable;
    overscroll-behavior:none;
  }
  #canvas-wrap,#canvas{touch-action:none}
  #canvas .node{touch-action:none}
  #canvas .node .nport{touch-action:none}
  #topbar{
    height:var(--topbar-h);
    background:var(--panel-bg);
    border-block-end:1px solid var(--panel-border);
    display:flex;align-items:center;
    padding-inline:10px;
    gap:5px;flex-shrink:0;
    position:relative;z-index:20;
    backdrop-filter:blur(12px);
    background:color-mix(in srgb, var(--panel-bg) 88%, transparent);
    overflow-x:auto;overflow-y:hidden;
  }
  #topbar::-webkit-scrollbar{height:3px}
  #topbar .spacer{flex:1}
  #app{flex:1;display:flex;min-height:0}
  #sidebar{
    width:280px;
    background:var(--panel-bg-2);
    border-inline-end:1px solid var(--panel-border);
    flex-shrink:0;display:flex;flex-direction:column;
  }
  #canvas-wrap{
    flex:1;position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 20% 30%, var(--canvas-grid), transparent 45%),
      radial-gradient(var(--dot) 1px, transparent 1px),
      var(--canvas-bg);
    background-size:auto, 32px 32px, auto;
    container-type:inline-size;
  }
  #canvas{position:absolute;inset:0}
  #inspector{
    width:var(--inspector-w);
    background:var(--panel-bg-2);
    border-inline-start:1px solid var(--panel-border);
    flex-shrink:0;overflow-y:auto;
  }
  #inspector-body{min-height:200px}
}

@layer components {
  /* 사이드바 */
  #wf-list{list-style:none;padding:var(--space-2);overflow-y:auto;flex:1}
  #wf-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;font-size:13px;margin-block-end:4px;
    color:var(--panel-text-dim);
    transition:background .15s ease, color .15s ease;
    min-height:36px;
  }
  #wf-list li .wf-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  #wf-list li:hover{background:var(--dark-3);color:var(--panel-text)}
  #wf-list li.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #wf-list .wf-del{border:none;background:none;font-size:16px;color:var(--panel-text-faint);cursor:pointer;padding-inline:var(--space-1)}
  #wf-list .wf-del:hover{color:var(--danger)}
  #add-wf{
    margin:var(--space-2) var(--space-3);
    padding:var(--space-3);
    border:1px dashed var(--dark-border);
    border-radius:var(--radius-md);
    background:none;cursor:pointer;font-size:14px;
    color:var(--panel-text-dim);
    transition:border-color .15s, background .15s, color .15s;
  }
  #add-wf:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

  /* 노드 — 라이트 표면 (다크 캔버스 대비 아님, 라이트 캔버스 위) */
  #canvas .node{
    position:absolute;min-width:160px;padding:10px 14px;
    background:linear-gradient(180deg, var(--dark-3) 0%, var(--node-bg) 30%);
    border:1px solid var(--node-border);
    border-radius:var(--radius-md);
    cursor:grab;user-select:none;
    display:flex;align-items:center;gap:var(--space-2);
    box-shadow:var(--shadow-sm);
    z-index:1;
    color:var(--node-text);
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s;
  }
  #canvas .node::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    border-radius:var(--radius-md) var(--radius-md) 0 0;
    background:var(--node-accent, var(--border-strong));
  }
  #canvas .node:hover{
    background:var(--dark-3);
    transform:translateY(-2px);  /* 호버 리프트 */
    box-shadow:0 6px 16px rgba(0,0,0,.25);
    border-color:color-mix(in srgb, var(--node-accent, var(--border-strong)) 50%, var(--node-border));
  }
  /* 타입별 상단 바 색 */
  #canvas .node.type-start{--node-accent:#2ea043}
  #canvas .node.type-process{--node-accent:#1f6feb}
  #canvas .node.type-decision{--node-accent:#d29922}
  #canvas .node.type-approval{--node-accent:#b45f06}
  #canvas .node.type-supervisor{--node-accent:#8957e5}
  #canvas .node.type-reviewer{--node-accent:#0d9488}
  #canvas .node.type-end{--node-accent:#d1242f}
  #canvas .node:hover{border-color:color-mix(in srgb, var(--accent) 60%, var(--node-border))}
  #canvas .node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft), 0 0 18px var(--accent-glow);transform:translateY(-2px)}
  #canvas .node:has(.nport:active){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft), 0 0 18px var(--accent-glow)}
  #canvas .node .nicon{
    width:26px;height:26px;border-radius:var(--radius-sm);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:14px;flex-shrink:0;aspect-ratio:1;
  }
  #canvas .node .nlabel{
    font-size:14px;font-weight:700;color:#f1f3f5;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-wrap:balance;
  }
  #canvas .node .nindex{
    font-size:10px;font-weight:700;color:var(--panel-text-faint);
    background:var(--dark);border-radius:4px;padding:1px 5px;
    font-family:ui-monospace,monospace;
  }
  #canvas .node .nport{
    position:absolute;inset-inline-end:-4px;top:50%;translate:0 -50%;
    width:18px;height:18px;border-radius:50%;
    background:var(--accent);
    border:3px solid var(--node-bg);
    cursor:crosshair;opacity:0;transition:opacity .15s, scale .15s;
    z-index:5;pointer-events:auto;
    box-shadow:0 0 10px var(--accent-glow);
  }
  #canvas .node .nport:hover{scale:1.3;background:var(--accent-strong)}
  #canvas .node:hover .nport{opacity:1}
  #canvas .node .nport:hover{scale:1.3}

  /* 엣지 — 다크 캔버스에서 가시성 개선 */
  #edges{position:absolute;inset:0;pointer-events:none;z-index:0}
  #edges line{pointer-events:stroke;stroke:#8fa3b5 !important;stroke-width:3}
  #edges text{fill:var(--accent) !important}

  /* 인스펙터 */
  #inspector h3{font-size:14px;padding:14px var(--space-4) var(--space-2);border-block-end:1px solid var(--panel-border);color:var(--panel-text)}
  #inspector-body{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
  #inspector label{font-size:12px;color:var(--panel-text-dim);margin-block-start:var(--space-2)}
  #inspector input,#inspector textarea{
    width:100%;padding:var(--space-2);
    background:var(--dark-3);
    border:1px solid var(--dark-border);
    border-radius:var(--radius-sm);
    font-size:13px;font-family:inherit;
    color:var(--panel-text);
    transition:border-color .15s, box-shadow .15s;
  }
  #inspector input:focus-visible,#inspector textarea:focus-visible{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);
  }
  #inspector button{margin-block-start:var(--space-3);padding:9px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px}
  #f-del-node,#f-del-edge{background:var(--danger-soft);color:var(--danger)}

  /* 컨텍스트 메뉴 */
  #ctx-menu{
    position:fixed;display:none;z-index:50;
    background:var(--dark-2);
    border:1px solid var(--dark-border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-md);
    padding:var(--space-1);
    backdrop-filter:blur(8px);
    background:color-mix(in srgb, var(--dark-2) 92%, transparent);
  }
  #ctx-menu button{
    display:block;width:100%;text-align:left;
    padding:var(--space-2) var(--space-3);
    border:none;background:none;cursor:pointer;font-size:13px;border-radius:var(--radius-sm);
    color:var(--panel-text);
    transition:background .12s, color .12s;
  }
  #ctx-menu button:hover{background:var(--dark-3);color:var(--accent)}
}

@layer utilities {
  #topbar button{
    padding:5px 11px;
    background:transparent;
    border:1px solid var(--dark-border);
    border-radius:8px;
    color:var(--panel-text);
    cursor:pointer;font-size:12px;font-weight:500;
    white-space:nowrap;height:30px;line-height:1;
    transition:border-color .15s, background .15s, color .15s, translate .15s, transform .1s;
  }
  #topbar button:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  /* 우상단 내보내기/가져오기 — #00ff87 강조 버튼 */
  #topbar button.tb-action{
    background:var(--accent);
    border:1px solid var(--accent);
    color:#04100a;
    font-weight:700;
    box-shadow:0 0 12px var(--accent-glow);
  }
  #topbar button.tb-action:hover{
    background:var(--accent-strong);
    border-color:var(--accent-strong);
    color:#04100a;
    box-shadow:0 0 18px var(--accent-glow);
  }
  #topbar button:active{translate:0 1px;transform:scale(.97)}
  #topbar button{transition:border-color .15s, background .15s, color .15s, translate .15s, transform .1s}
  #topbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 4px rgba(0,255,135,.15)}

  #topbar input#wf-name{
    background:var(--dark-2);
    border:1px solid var(--dark-border);
    border-radius:var(--radius-sm);
    color:var(--panel-text);
    padding:7px 12px;font-size:13px;
  }
  #topbar input#wf-name:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

  @container (max-width: 480px){
    #canvas .node{min-width:130px;padding:8px 10px}
    #canvas .node .nlabel{font-size:12px}
  }

  @media(max-width:900px){
    #sidebar{position:absolute;z-index:10;height:100%;translate:-100% 0;transition:translate .2s ease}
    #sidebar.open{translate:0 0}
    #inspector{position:absolute;inset-inline-end:0;z-index:10;height:100%;translate:100% 0;transition:translate .2s ease}
    #inspector.open{translate:0 0}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }

  /* ═══ 모바일 최적화 ═══ */
  #mobile-actions{display:none}
  .mm-item{display:block;width:100%;text-align:left;padding:12px 14px;border:none;background:none;color:var(--panel-text);cursor:pointer;font-size:14px;border-radius:10px}
  .mm-item:hover{background:var(--dark-3);color:var(--accent)}

  @media (max-width: 768px){
    /* 상단바 축소: wf-name/검색은 숨기고 나머지 버튼은 하단으로 */
    #topbar{height:48px;padding-inline:10px;gap:8px}
    #topbar input#wf-name{display:none}
    #topbar input#wf-search{display:none}
    #topbar button:not(#sidebar-toggle){display:none}
    #sidebar-toggle{font-size:18px;padding:8px 10px}

    /* 하단 고정 액션 바 */
    #mobile-actions{
      display:flex;position:fixed;bottom:0;left:0;right:0;z-index:55;
      background:color-mix(in srgb, var(--dark-2) 92%, transparent);
      backdrop-filter:blur(10px);
      border-top:1px solid var(--dark-border);
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));
      gap:8px;justify-content:space-between;
    }
    #mobile-actions button{
      flex:1;padding:12px 6px;font-size:12px;white-space:nowrap;
      background:var(--dark-3);border:1px solid var(--dark-border);
      color:var(--panel-text);border-radius:10px;cursor:pointer;
      min-height:44px;  /* 터치 최적 크기 */
    }
    #mobile-actions button:active{background:var(--accent-soft);color:var(--accent)}
    #mobile-actions #m-btn-run{background:var(--accent);color:#04100a;font-weight:700;border-color:var(--accent)}

    /* 캔버스 하단 여백 — 하단바에 가려지지 않게 */
    #canvas-wrap{margin-bottom:0}
    #app{min-height:0}

    /* 인스펙터 — 하단 시트 스타일 */
    #inspector{
      width:100%;height:60vh;top:auto;bottom:0;
      border-radius:16px 16px 0 0;
      border-left:none;border-top:1px solid var(--dark-border);
    }
    #inspector{translate:0 100%}
    #inspector.open{translate:0 0}

    /* 사이드바 — 전체 높이 */
    #sidebar{width:240px;top:0;height:100%}

    /* 미니맵 — 하단바 위로 */
    #minimap{bottom:70px;right:12px;width:130px;height:90px}

    /* 토스트 — 하단바 위 */
    #toast-container{bottom:70px}

    /* 실행 상태 바 — 하단바 위 */
    #run-status-bar{bottom:64px}
  }
  /* 다크 스크롤바 */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--dark-border);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb, var(--accent) 40%, var(--dark-border))}

  /* 실행 미리보기 모드 */
  #run-overlay{
    position:fixed;inset:0;z-index:60;
    background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(3px);
  }
  #run-panel{
    background:var(--dark-2);border:1px solid var(--dark-border);
    border-radius:var(--radius-lg);padding:20px 24px;
    min-width:340px;box-shadow:var(--shadow-md);
    color:var(--panel-text);
  }
  #run-panel h4{color:var(--accent);margin-bottom:12px}
  #run-panel button{margin-top:8px}
  .node.run-current{
    border-color:var(--accent) !important;
    box-shadow:0 0 0 3px var(--accent-soft), 0 0 24px var(--accent-glow) !important;
    background:color-mix(in srgb, var(--accent) 12%, var(--dark-2)) !important;
  }
  .node.run-visited{border-color:color-mix(in srgb, var(--accent) 50%, var(--dark-border)) !important}

  /* 다중 선택 */
  #canvas .node.multi{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

  /* 줌 컨트롤 */
  #zoom-controls{
    position:fixed;right:16px;bottom:150px;z-index:40;
    display:flex;flex-direction:column;gap:6px;align-items:center;
    background:color-mix(in srgb, var(--dark-2) 90%, transparent);
    border:1px solid var(--dark-border);border-radius:12px;
    padding:8px;backdrop-filter:blur(8px);
  }
  #zoom-controls button{
    width:32px;height:32px;border-radius:8px;font-size:16px;
    background:var(--dark-3);border:1px solid var(--dark-border);
    color:var(--panel-text);cursor:pointer;
    transition:background .15s, color .15s, transform .1s;
  }
  #zoom-controls button:hover{background:var(--accent-soft);color:var(--accent)}
  #zoom-controls button:active{transform:scale(.9)}
  #zoom-level{font-size:10px;color:var(--panel-text-faint);font-family:ui-monospace,monospace}

  /* 미니맵 */
  #minimap{
    position:fixed;right:16px;bottom:16px;z-index:40;
    width:180px;height:120px;
    background:color-mix(in srgb, var(--dark-2) 92%, transparent);
    border:1px solid var(--dark-border);border-radius:var(--radius-md);
    overflow:hidden;pointer-events:none;
    backdrop-filter:blur(6px);
  }
  #minimap .mm-node{position:absolute;border-radius:50%;opacity:.9}
  #minimap .mm-node.type-start{background:var(--n-start)}
  #minimap .mm-node.type-process{background:var(--n-process)}
  #minimap .mm-node.type-decision{background:var(--n-decision)}
  #minimap .mm-node.type-end{background:var(--n-end)}

  /* 토스트 */
  #toast-container{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .toast{
    background:var(--dark-2);border:1px solid var(--dark-border);
    color:var(--panel-text);border-radius:var(--radius-md);
    padding:12px 18px;font-size:13px;box-shadow:var(--shadow-md);
    opacity:0;translate:0 8px;transition:opacity .25s, translate .25s;
    max-width:520px;
  }
  .toast.show{opacity:1;translate:0 0}

  /* 템플릿 버튼 */
  .tpl-btn{
    display:block;width:100%;text-align:left;
    padding:8px 10px;margin-top:6px;
    background:var(--dark-3);border:1px solid var(--dark-border);
    border-radius:var(--radius-sm);color:var(--panel-text);
    cursor:pointer;font-size:12px;
    transition:border-color .15s, color .15s;
  }
  .tpl-btn:hover{border-color:var(--accent);color:var(--accent)}

  /* 그룹 노드 */
  .group-box{
    position:absolute;z-index:0;
    background:color-mix(in srgb, var(--accent) 4%, transparent);
    border:1px dashed color-mix(in srgb, var(--accent) 40%, transparent);
    border-radius:16px;pointer-events:none;
  }
  .group-box .g-label{
    position:absolute;top:-10px;left:12px;
    font-size:11px;color:var(--accent);
    background:var(--dark);padding:0 8px;border-radius:4px;
  }
  .group-box.collapsed{border-style:solid}

  /* 인라인 편집 */
  .inline-edit{
    background:var(--dark-3);border:1px solid var(--accent);
    border-radius:6px;color:var(--panel-text);
    font-size:14px;font-weight:600;padding:2px 6px;
    width:100%;font-family:inherit;outline:none;
  }

  /* AI 패널 */
  #ai-panel h4{color:var(--accent);margin-bottom:12px;font-size:15px}

}

    <div id="stats-body" style="font-size:13px;color:var(--panel-text)"></div>
  </div>
  <div id="runlog-panel" style="display:none;position:fixed;bottom:16px;left:16px;z-index:45;background:var(--dark-2);border:1px solid var(--dark-border);border-radius:12px;padding:12px 16px;width:340px;max-height:200px;overflow-y:auto;box-shadow:0 6px 24px rgba(0,0,0,.28)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <strong style="color:var(--accent);font-size:13px">실행 로그</strong>
      <button id="runlog-close" class="tb-action" style="padding:3px 8px;font-size:11px">✕</button>
    </div>
    <div id="runlog-body" style="font-size:12px;color:var(--panel-text-dim)"></div>
  </div>
  <div id="app">
    <aside id="sidebar">
      <button id="add-wf">+ 새 워크플로우</button>
      <ul id="wf-list"></ul>
      <div id="template-panel" style="display:none;padding:10px;border-top:1px solid var(--panel-border)">
        <strong style="font-size:12px;color:var(--panel-text-dim)">템플릿</strong>
        <button class="tpl-btn" data-tpl="approval">승인 프로세스</button>
        <button class="tpl-btn" data-tpl="content">콘텐츠 제작</button>
        <button class="tpl-btn" data-tpl="pipeline">데이터 파이프라인</button>
      </div>
    </aside>
    <main id="canvas-wrap">
      <svg id="edges"><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8a8f98"/></marker></defs></svg>
      <div id="canvas"></div>
    </main>
    <aside id="inspector">
      <h3>속성</h3>
      <div id="inspector-body"></div>
    </aside>
  </div>
<script>
// 마이그레이션 대비: 같은 도메인 하위 슬러그에서도 기존 사이트와
// localStorage 충돌 없이 독립 동작하도록 경로 기반 키 사용
const LS_KEY = 'wf_app_' + (location.pathname.split('/').filter(Boolean).join('_') || 'root');
// 백업 키 (JSON 파손 대비)
const LS_BACKUP_KEY = LS_KEY + '_backup';

// === 서버 연동 (옵션) ===
// 서버가 있으면(localhost:3737 등) 자동 사용, 없으면 localStorage만으로 동작
const API_BASE = (window.__WF_API__ || 'http://localhost:3737');
let serverOnline = false;
let syncTimer = null;

async function checkServer() {
  try {
    const r = await fetch(API_BASE + '/api/workflows', { signal: AbortSignal.timeout(2500) });
    serverOnline = r.ok;
  } catch (e) { serverOnline = false; }
  updateSyncStatus();
  return serverOnline;
}

function updateSyncStatus() {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.textContent = serverOnline ? '서버 연결됨' : '로컬 저장';
  el.style.color = serverOnline ? '#1a7f37' : '#888';
}

// 서버에서 전체 워크플로우 로드 (성공 시 store 대체)
async function loadFromServer() {
  if (!(await checkServer())) return false;
  try {
    const r = await fetch(API_BASE + '/api/workflows');
    const j = await r.json();
    if (!j.success) return false;
    const list = j.workflows || [];
    if (list.length === 0) return false;
    const loaded = [];
    for (const item of list) {
      const d = await (await fetch(API_BASE + '/api/workflows/' + item.id)).json();
      if (d.success && d.workflow) {
        const wf = d.workflow.data || {};
        if (Array.isArray(wf.nodes) && Array.isArray(wf.edges)) {
          loaded.push({ id: d.workflow.id, name: d.workflow.name, nodes: wf.nodes, edges: wf.edges });
        }
      }
    }
    if (loaded.length > 0) {
      store.workflows = loaded;
      store.activeWorkflowId = loaded[0].id;
      return true;
    }
  } catch (e) { console.warn('server load failed', e); }
  return false;
}

// 서버에 전체 워크플로우 동기화 (디바운스)
// 오프라인 편집 큐 — 서버 미연결 시 변경 대기
let offlineQueue = [];
function queueOfflineSync() {
  try { offlineQueue = JSON.parse(localStorage.getItem(LS_KEY + '_offline') || '[]'); } catch (e) { offlineQueue = []; }
  const wf = currentWorkflow();
  if (wf && !serverOnline) {
    offlineQueue.push({ wfId: wf.id, ts: Date.now() });
    localStorage.setItem(LS_KEY + '_offline', JSON.stringify(offlineQueue.slice(-50)));
  }
}
function flushOfflineQueue() {
  if (!serverOnline) return;
  try { offlineQueue = JSON.parse(localStorage.getItem(LS_KEY + '_offline') || '[]'); } catch (e) { offlineQueue = []; }
  if (offlineQueue.length > 0) {
    const wf = currentWorkflow();
    if (wf) syncToServer();
    localStorage.removeItem(LS_KEY + '_offline');
    console.log('오프라인 편집 ' + offlineQueue.length + '건 동기화');
    toast('오프라인 편집 ' + offlineQueue.length + '건 동기화됨');
  }
}
function syncToServer() {
  if (!serverOnline) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      for (const wf of store.workflows) {
        await fetch(API_BASE + '/api/workflows/' + encodeURIComponent(wf.id), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: wf.name, data: { nodes: wf.nodes, edges: wf.edges } }),
        });
      }
    } catch (e) { console.warn('server sync failed', e); queueOfflineSync(); }
  }, 800);
}
let store = { workflows: [], activeWorkflowId: null };
let saveTimer = null;

function defaultWorkflow(name) {
  const id = 'wf_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  return {
    id, name,
    nodes: [
      { id: 'n_' + Date.now().toString(36) + 'a', type: 'start', x: 80, y: 100, label: '시작', desc: '', assignee: '', due: '', tags: [] },
      { id: 'n_' + Date.now().toString(36) + 'b', type: 'end', x: 80, y: 340, label: '종료', desc: '', assignee: '', due: '', tags: [] }
    ],
    edges: []
  };
}

function loadStore() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      store = JSON.parse(raw);
      if (!Array.isArray(store.workflows)) store.workflows = [];
      if (store.workflows.length === 0) {
        const wf = defaultWorkflow('새 워크플로우');
        store.workflows.push(wf);
        store.activeWorkflowId = wf.id;
      }
      if (!store.workflows.find(w => w.id === store.activeWorkflowId)) {
        store.activeWorkflowId = store.workflows[0].id;
      }
    } else {
      const wf = defaultWorkflow('새 워크플로우');
      store.workflows = [wf];
      store.activeWorkflowId = wf.id;
    }
  } catch (e) {
    console.warn('load failed', e);
    // 백업에서 복구 시도
    try {
      const backup = localStorage.getItem(LS_BACKUP_KEY);
      if (backup) {
        store = JSON.parse(backup);
        if (!Array.isArray(store.workflows)) store.workflows = [];
      }
    } catch (e2) { console.warn('backup load failed', e2); }
    if (!store.workflows || store.workflows.length === 0) {
      const wf = defaultWorkflow('새 워크플로우');
      store = { workflows: [wf], activeWorkflowId: wf.id };
    }
  }
}

function saveStore(immediate) {
  clearTimeout(saveTimer);
  const write = () => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(store));
      milestoneCheck();
      localStorage.setItem(LS_BACKUP_KEY, JSON.stringify(store));
      const el = document.getElementById('save-status');
      if (el) { el.textContent = '저장됨'; setTimeout(() => el.textContent = '', 2000); }
    } catch (e) {
      const el = document.getElementById('save-status');
      if (el) el.textContent = '⚠ 저장 실패 (localStorage 불가)';
    }
  };
  if (immediate) { write(); }
  else saveTimer = setTimeout(write, 500);
  syncToServer();
  recordVersionDebounced();
  broadcastLocalChange();
}
let verTimer = null;
function recordVersionDebounced() {
  clearTimeout(verTimer);
  verTimer = setTimeout(() => {
    const wf = currentWorkflow();
    if (!wf) return;
    const key = LS_KEY + '_ver_' + wf.id;
    let versions = [];
    try { versions = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
    versions.push({ t: new Date().toISOString(), data: JSON.parse(snapshotState()) });
    if (versions.length > 20) versions = versions.slice(-20);
    localStorage.setItem(key, JSON.stringify(versions));
  }, 3000);
}

function currentWorkflow() {
  return store.workflows.find(w => w.id === store.activeWorkflowId) || null;
}

// === Sidebar ===
function renderSidebar() {
  const ul = document.getElementById('wf-list');
  ul.innerHTML = '';
  setTimeout(() => {
    const items = ul.querySelectorAll('li').length;
    let hint = document.getElementById('sidebar-hint');
    if (items === 0) {
      if (!hint) {
        hint = document.createElement('div');
        hint.id = 'sidebar-hint';
        hint.style.cssText = 'padding:14px;font-size:12px;color:var(--panel-text-faint);text-align:center';
        const sb = document.getElementById('sidebar');
        if (sb) sb.appendChild(hint);
      }
      hint.innerHTML = '워크플로우 없음<br><strong style="color:var(--accent)">+ 버튼</strong>으로 시작';
      hint.style.display = 'block';
    } else if (hint) hint.style.display = 'none';
  }, 100);
  store.workflows.forEach(wf => {
    const li = document.createElement('li');
    const nameSpan = document.createElement('span');
    nameSpan.className = 'wf-name';
    nameSpan.textContent = wf.name;
    li.appendChild(nameSpan);
    li.className = wf.id === store.activeWorkflowId ? 'active' : '';
    li.dataset.id = wf.id;
    li.addEventListener('click', () => {
      store.activeWorkflowId = wf.id;
      document.getElementById('wf-name').value = wf.name;
      renderAll(); saveStore();
    });
    const del = document.createElement('button');
    del.textContent = '×';
    del.className = 'wf-del';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm('워크플로우를 삭제할까요?')) return;
      store.workflows = store.workflows.filter(w => w.id !== wf.id);
      if (store.activeWorkflowId === wf.id) {
        store.activeWorkflowId = store.workflows[0]?.id || null;
      }
      renderAll(); saveStore(true);
    });
    li.appendChild(del);
    ul.appendChild(li);
  });
}

document.getElementById('add-wf').addEventListener('click', () => {
  const wf = defaultWorkflow('새 워크플로우 ' + (store.workflows.length + 1));
  store.workflows.push(wf);
  store.activeWorkflowId = wf.id;
  document.getElementById('wf-name').value = wf.name;
  renderAll(); saveStore(true);
});

function renderAll() {
  renderSidebar();
  renderCanvas();
  renderInspector();
  renderMinimap();
  renderEmptyStates();
}

// 1: 빈 상태 온보딩
function renderEmptyStates() {
  const wf = currentWorkflow();
  const nodes = (wf && wf.nodes) || [];
  const canvas = document.getElementById('canvas-wrap');
  let guide = document.getElementById('empty-guide');
  if (nodes.length === 0) {
    if (!guide) {
      guide = document.createElement('div');
      guide.id = 'empty-guide';
      guide.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:5;pointer-events:none';
      canvas.appendChild(guide);
    }
    guide.innerHTML = '<div style="font-size:15px;color:var(--panel-text-dim);margin-bottom:12px">캔버스가 비어 있습니다</div>' +
      '<div style="font-size:13px;color:var(--panel-text-faint)">🖱️ <strong>우클릭</strong>으로 노드 추가 · 노드 <strong>가장자리</strong>에서 연결<br>' +
      '<strong>Ctrl+K</strong> 명령 팔레트 · [AI]로 자동 생성</div>';
    guide.style.display = 'block';
  } else if (guide) {
    guide.style.display = 'none';
  }
}

// 5: 단계별 성공 표시
function milestoneCheck() {
  try {
    const wf = currentWorkflow();
    if (!wf) return;
    const key = LS_KEY + '_milestones';
    const m = JSON.parse(localStorage.getItem(key) || '{}');
    const id = wf.id;
    if (!m[id]) m[id] = { node: false, edge: false, run: false };
    const cur = m[id];
    if ((wf.nodes || []).length > 0 && !cur.node) { cur.node = true; toast('🎉 첫 노드 추가 완료!'); }
    if ((wf.edges || []).length > 0 && !cur.edge) { cur.edge = true; toast('🎉 첫 연결 완료!'); }
    localStorage.setItem(key, JSON.stringify(m));
  } catch (e) {}
}

// === Canvas ===
const NODE_TYPES = {
  start:      { color: '#2ea043', icon: '▶', label: '시작', svg: '<svg width="14" height="14" viewBox="0 0 14 14" fill="#fff"><path d="M3 1l10 6-10 6z"/></svg>' },
  process:    { color: '#1f6feb', icon: '▢', label: '프로세스', svg: '<svg width="14" height="14" viewBox="0 0 14 14" fill="#fff"><rect x="2" y="2" width="10" height="10" rx="2"/></svg>' },
  decision:   { color: '#d29922', icon: '◇', label: '판단', svg: '<svg width="14" height="14" viewBox="0 0 14 14" fill="#fff"><path d="M7 1l6 6-6 6-6-6z"/></svg>' },
  approval:   { color: '#b45f06', icon: '⏸', label: '승인', svg: '<svg width="14" height="14" viewBox="0 0 14 14" fill="#fff"><rect x="2" y="2" width="3.5" height="10" rx="1"/><rect x="8.5" y="2" width="3.5" height="10" rx="1"/></svg>' },
  supervisor: { color: '#8957e5', icon: '§', label: '감독', svg: '<svg width="14" height="14" viewBox="0 0 14 14" fill="#fff"><path d="M7 1l6 3v6l-6 3-6-3V4z"/><circle cx="7" cy="7" r="2"/></svg>' },
  reviewer:   { color: '#0d9488', icon: '✓', label: '검토', svg: '<svg width="14" height="14" viewBox="0 0 14 14" fill="#fff"><path d="M1 7l4 4 8-9"/><path d="M1 7l4 4 8-9" stroke="#0d9488" stroke-width="2" fill="none"/></svg>' },
  end:        { color: '#d1242f', icon: '●', label: '종료', svg: '<svg width="14" height="14" viewBox="0 0 14 14" fill="#fff"><circle cx="7" cy="7" r="5"/></svg>' }
};
let selected = { type: null, id: null };

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 노드 순번 — 타입별 인덱스
let indexCounter = {};
function nIndex(n) {
  if (n.type === 'start' || n.type === 'end') return '';
  if (!indexCounter[n.type]) indexCounter[n.type] = 0;
  indexCounter[n.type]++;
  return indexCounter[n.type];
}
// 3: 노드 hover 툴팁 — 예상 비용/시간 + 타입 설명
function nodeTooltip(n) {
  const t = NODE_TYPES[n.type];
  const est = n.type === 'decision' ? '~2s · LLM 1회' : n.type === 'approval' ? '~5s · 승인 대기' :
    n.type === 'reviewer' ? '~1.5s · 검증' : n.action ? '~1s · 스크립트' : '~0.3s';
  return '<strong>' + (t ? t.label : n.type) + '</strong> — ' + (n.label || '') + '<br>' +
    '<span style="font-size:11px;color:var(--panel-text-dim)">예상: ' + est + '</span>';
}
function renderCanvas() {
  indexCounter = {};  // 노드 순번 초기화
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = '';
  renderEdges();
  const wf = currentWorkflow();
  if (!wf) return;
  wf.nodes.forEach(n => {
    if (!isInViewport(n)) return;  // 가상화: 뷰포트 밖 노드 생략
    const isSel = selected.type === 'node' && selected.id === n.id;
    const isMulti = multiSelect.has(n.id);
    const isRun = runState && runState.currentId === n.id;
    const isVisited = runState && runState.visited && runState.visited.has(n.id);
    const el = document.createElement('div');
    el.className = 'node type-' + n.type
      + (isSel ? ' sel' : '')
      + (isMulti ? ' multi' : '')
      + (isRun ? ' run-current' : '')
      + (isVisited ? ' run-visited' : '');
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.dataset.id = n.id;
    el.setAttribute('tabindex', '0');
    const agent = getAgent(n.agentId);
    const agentBadge = agent
      ? `<span class="agent-badge" style="background:${escapeHtml(agent.color)}">${escapeHtml(agent.name)}</span>`
      : `<span class="agent-badge unassigned" title="미할당">미할당</span>`;
    el.innerHTML = `<span class="nicon" style="background:${NODE_TYPES[n.type].color}">${NODE_TYPES[n.type].svg}</span>
      <span class="nlabel">${escapeHtml(n.label || NODE_TYPES[n.type].label)}</span>
      <span class="nindex">${nIndex(n)}</span>
      ${agentBadge}
      ${nodeStatusBadge(n)}
      ${renderConfidence(n)}
      ${pipelineStatusBadge(n)}
      ${agentHandoffInfo(n)}
      ${blockerBadge(n)}
      <span class="nport" data-port="out"></span>
      ${n.locked ? '<span class="lock-badge">🔒</span>' : ''}`;
    // 선택된 에이전트의 담당 노드 강조
    if (selectedAgent && n.agentId === selectedAgent) el.classList.add('agent-highlight');
    el.addEventListener('mouseenter', (e) => {
      const tt = document.createElement('div');
      tt.id = 'node-tooltip';
      tt.style.cssText = 'position:fixed;z-index:120;background:var(--dark-3);border:1px solid var(--dark-border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--panel-text);pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.3)';
      tt.innerHTML = nodeTooltip(n);
      document.body.appendChild(tt);
      const r = el.getBoundingClientRect();
      tt.style.left = Math.min(r.left + r.width + 8, window.innerWidth - 220) + 'px';
      tt.style.top = Math.max(8, r.top - 10) + 'px';
    });
    el.addEventListener('mouseleave', () => {
      const tt = document.getElementById('node-tooltip');
      if (tt) tt.remove();
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selected = { type: 'node', id: n.id }; renderAll(); }
    });
    el.addEventListener('mousedown', (e) => startDrag(e, n));
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (e.shiftKey) { toggleMulti(n.id); }
      else if (multiSelect.size > 0) { clearMulti(); selectNode(n.id); }
      else { selectNode(n.id); }
    });
    el.addEventListener('dblclick', (e) => { e.stopPropagation(); enableInlineEdit(n); });
    canvas.appendChild(el);
    attachNodeTouch(n);  // 터치 드래그/연결/제스처 연결
  });
  renderGroups();
}

function selectNode(id) {
  selected = { type: 'node', id };
  renderAll();
}

function startDrag(e, node) {
  e.preventDefault();
  if (lockMode || node.locked) { toast('🔒 잠긴 노드'); return; }
  if (e.shiftKey) {
    toggleMulti(node.id);
    return;
  }
  selected = { type: 'node', id: node.id };
  // 3: 드래그 고스트
  const dragEl = e.target.closest('.node');
  if (dragEl) dragEl.classList.add('drag-ghost');
  const startX = e.clientX, startY = e.clientY;
  const origX = node.x, origY = node.y;
  // 다중 선택된 다른 노드들도 함께 이동
  const group = new Set(multiSelect);
  if (!group.has(node.id)) group.add(node.id);
  const orig = {};
  group.forEach(id => {
    const n = currentWorkflow().nodes.find(x => x.id === id);
    if (n) orig[id] = { x: n.x, y: n.y };
  });
  function move(ev) {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    group.forEach(id => {
      const n = currentWorkflow().nodes.find(x => x.id === id);
      if (n && orig[id]) {
        n.x = snapValue(orig[id].x + dx); n.y = snapValue(orig[id].y + dy);
        const el = document.querySelector(`#canvas .node[data-id="${id}"]`);
        if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
      }
    });
    renderEdgesThrottled();
  }
  function up() {
    window.removeEventListener('mousemove', move);
    window.removeEventListener('mouseup', up);
    if (dragEl) dragEl.classList.remove('drag-ghost');
    if (node.x !== origX || node.y !== origY) pushHistory();
    saveStore();
    renderEdges();
    // 3: 착지 바운스
    if (dragEl) {
      dragEl.classList.add('drop-bounce');
      setTimeout(() => dragEl.classList.remove('drop-bounce'), 300);
    }
  }
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
}

// === EdgeLayer ===
function renderEdges() {
  const svg = document.getElementById('edges');
  // defs(marker)는 유지하고 line/text만 제거 — 화살표 보존
  const defs = svg.querySelector('defs');
  svg.innerHTML = '';
  if (defs) svg.appendChild(defs);
  const wf = currentWorkflow();
  if (!wf) return;
  // O(1) 노드 조회용 Map — 대규모 워크플로우 성능
  const nodeMap = new Map(wf.nodes.map(n => [n.id, n]));
  wf.edges.forEach(e => {
    const from = nodeMap.get(e.from);
    const to = nodeMap.get(e.to);
    if (!from || !to) { console.warn('orphan edge', e.id); return; }
    const x1 = from.x + 90, y1 = from.y + 26;
    const x2 = to.x + 90, y2 = to.y + 26;
    const isActive = runState && (runState.currentId === e.from || runState.currentId === e.to);
    // 베지어 곡선 엣지
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', edgePath(x1, y1, x2, y2));
    path.setAttribute('stroke', isActive ? '#00ff87' : '#7d8fa1');
    path.setAttribute('stroke-width', isActive ? '3.5' : '2.5');
    path.setAttribute('fill', 'none');
    path.dataset.id = e.id;
    path.style.cursor = 'pointer';
    path.addEventListener('click', (ev) => { ev.stopPropagation(); selected = { type: 'edge', id: e.id }; renderAll(); });
    svg.appendChild(path);
    if (e.label) {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', (x1+x2)/2); t.setAttribute('y', (y1+y2)/2 - 6);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '12');
      t.setAttribute('fill', isActive ? '#00ff87' : '#d29922');
      t.setAttribute('font-weight', 'bold');
      t.textContent = e.label;
      svg.appendChild(t);
    }
  });
  renderTempEdge();
  renderHandoffs();
}

// 연결 드래그: 노드의 out 핸들에서 시작
let connectFrom = null;
document.addEventListener('mousedown', (e) => {
  const port = e.target.closest('.nport');
  if (!port) return;
  e.preventDefault(); e.stopPropagation();
  const fromId = port.closest('.node').dataset.id;
  connectFrom = fromId;
  function up(ev) {
    const target = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.node');
    if (target && target.dataset.id !== fromId) {
      const wf = currentWorkflow();
      const existing = wf.edges.filter(e2 => e2.from === fromId);
      const isDecision = wf.nodes.find(n => n.id === fromId)?.type === 'decision';
      const label = isDecision ? (existing.length === 0 ? 'Yes' : 'No') : '';
      wf.edges.push({ id: 'e_' + Date.now().toString(36), from: fromId, to: target.dataset.id, label });
      pushHistory();
      saveStore(); renderAll();
    }
    connectFrom = null;
    tempEdge = null; renderTempEdge();
    window.removeEventListener('mousemove', move);
    window.removeEventListener('mouseup', up);
  }
  function move(ev) {
    // 고무줄 임시 엣지 — 캔버스 좌표계로 변환 (줌/팬 반영)
    const from = currentWorkflow().nodes.find(n => n.id === fromId);
    if (from) {
      const rect = document.getElementById('canvas-wrap').getBoundingClientRect();
      tempEdge = {
        x1: from.x + 90, y1: from.y + 26,
        x2: (ev.clientX - rect.left - panX) / zoom,
        y2: (ev.clientY - rect.top - panY) / zoom
      };
      renderTempEdge();
    }
  }
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
});

document.getElementById('file-import').addEventListener('change', (e) => {

      }
      // ID 충돌 방지: 가져온 데이터의 ID를 새로 부여
      const idMap = {};
      imported.workflows.forEach(w => {
        const newWfId = 'wf_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
        idMap[w.id] = newWfId;

          idMap[n.id] = newN; n.id = newN;

          ed.from = idMap[ed.from] || ed.from;
          ed.to = idMap[ed.to] || ed.to;
        });
      });
      store.workflows = store.workflows.concat(imported.workflows);
      store.activeWorkflowId = imported.workflows[imported.workflows.length-1].id;
      saveStore(true); renderAll();
      const wfc = currentWorkflow();
      if (wfc) document.getElementById('wf-name').value = wfc.name;

// ── 2) Undo/Redo 스냅샷 스택 ──
let undoStack = [], redoStack = [];
const MAX_HISTORY = 50;
function snapshotState() {
  return JSON.stringify({ workflows: store.workflows, activeWorkflowId: store.activeWorkflowId });
}
function pushHistory() {
  undoStack.push(snapshotState());
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
}
function undo() {
  if (undoStack.length === 0) { toast('되돌릴 작업 없음'); return; }
  redoStack.push(snapshotState());
  const prev = JSON.parse(undoStack.pop());
  store.workflows = prev.workflows; store.activeWorkflowId = prev.activeWorkflowId;
  afterHistory();
}
function redo() {
  if (redoStack.length === 0) { toast('다시 실행할 작업 없음'); return; }
  undoStack.push(snapshotState());
  const next = JSON.parse(redoStack.pop());
  store.workflows = next.workflows; store.activeWorkflowId = next.activeWorkflowId;
  afterHistory();
}
function afterHistory() {
  const wf = currentWorkflow();
  if (wf) document.getElementById('wf-name').value = wf.name;
  renderAll(); saveStore(true);
}

// ── 4) 노드 복제 ──
function duplicateNode(id) {
  const wf = currentWorkflow();
  if (!wf) return;
  const n = wf.nodes.find(x => x.id === id);
  if (!n) return;
  pushHistory();
  const copy = JSON.parse(JSON.stringify(n));
  copy.id = 'n_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  copy.x += 24; copy.y += 24;
  wf.nodes.push(copy);
  selected = { type: 'node', id: copy.id };
  saveStore(); renderAll();
}

// ── 12) 다중 선택 ──
let multiSelect = new Set();
function toggleMulti(id) {
  if (multiSelect.has(id)) multiSelect.delete(id);
  else multiSelect.add(id);
  renderCanvas();
}
function clearMulti() { multiSelect.clear(); renderCanvas(); }
function deleteMulti() {
  const wf = currentWorkflow();
  if (!wf || multiSelect.size === 0) return;
  pushHistory();
  const ids = new Set(multiSelect);
  wf.nodes = wf.nodes.filter(n => !ids.has(n.id));
  wf.edges = wf.edges.filter(e => !ids.has(e.from) && !ids.has(e.to));
  multiSelect.clear();
  saveStore(true); renderAll();
}

// ── 6) 미니맵 + 줌/팬 ──
let zoom = 1, panX = 0, panY = 0;
const MINIMAP_W = 180, MINIMAP_H = 120;
function renderMinimap() {
  const mm = document.getElementById('minimap');
  const wf = currentWorkflow();
  if (!wf || wf.nodes.length === 0) { mm.style.display = 'none'; return; }
  mm.style.display = 'block';
  const xs = wf.nodes.map(n => n.x), ys = wf.nodes.map(n => n.y);
  const minX = Math.min(...xs) - 40, minY = Math.min(...ys) - 40;
  const maxX = Math.max(...xs) + 220, maxY = Math.max(...ys) + 80;
  const sx = MINIMAP_W / Math.max(maxX - minX, 1), sy = MINIMAP_H / Math.max(maxY - minY, 1);
  const s = Math.min(sx, sy);
  mm.innerHTML = '';
  wf.edges.forEach(e => {
    const from = wf.nodes.find(n => n.id === e.from), to = wf.nodes.find(n => n.id === e.to);
    if (!from || !to) return;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', (from.x - minX) * s); l.setAttribute('y1', (from.y - minY) * s);
    l.setAttribute('x2', (to.x - minX) * s); l.setAttribute('y2', (to.y - minY) * s);
    l.setAttribute('stroke', '#00ff87'); l.setAttribute('stroke-width', '1');
    mm.appendChild(l);
  });
  wf.nodes.forEach(n => {
    const d = document.createElement('div');
    d.className = 'mm-node type-' + n.type;
    d.style.left = (n.x - minX) * s + 'px';
    d.style.top = (n.y - minY) * s + 'px';
    d.style.width = '8px'; d.style.height = '8px';
    mm.appendChild(d);
  });
}

// ── 7) 자동 정렬 (위상 정렬 기반) ──
function autoAlign() {
  const wf = currentWorkflow();
  if (!wf || wf.nodes.length === 0) return;
  const indeg = {}; wf.nodes.forEach(n => indeg[n.id] = 0);
  wf.edges.forEach(e => { if (indeg[e.to] !== undefined) indeg[e.to]++; });
  const queue = wf.nodes.filter(n => (indeg[n.id] || 0) === 0);
  const order = [];
  while (queue.length) {
    const n = queue.shift(); order.push(n);
    wf.edges.forEach(e => {
      if (e.from === n.id && indeg[e.to] !== undefined) {
        indeg[e.to]--;
        if (indeg[e.to] === 0) queue.push(wf.nodes.find(x => x.id === e.to));
      }
    });
  }
  // 남은 노드(사이클)도 추가
  wf.nodes.forEach(n => { if (!order.includes(n)) order.push(n); });
  const COLS = 6, DX = 240, DY = 110;
  pushHistory();
  order.forEach((n, i) => {
    n.x = 60 + (i % COLS) * DX;
    n.y = 60 + Math.floor(i / COLS) * DY;
  });
  saveStore(); renderAll();
  toast('자동 정렬 완료 (' + order.length + '개 노드)');
}

// ── 5) 실행 미리보기 모드 ──
let runState = null;
function startRun() {
  const wf = currentWorkflow();
  if (!wf) return;
  const start = wf.nodes.find(n => n.type === 'start');
  if (!start) { toast('시작 노드가 없습니다'); return; }
  runState = { wfId: wf.id, currentId: start.id, visited: new Set() };
  renderRunPanel(); renderCanvas();
  document.getElementById('run-overlay').style.display = 'flex';
  toast('실행 미리보기 시작 — 시작 노드');
}
function runNext() {
  if (!runState) return;
  const wf = currentWorkflow();
  const cur = wf.nodes.find(n => n.id === runState.currentId);
  if (!cur) return;
  const outs = wf.edges.filter(e => e.from === cur.id).sort((a, b) => (a.label === 'Yes' ? -1 : 0) - (b.label === 'Yes' ? -1 : 0));
  if (outs.length === 0) { toast('종료 도달'); runState = null; renderRunPanel(); return; }
  const next = wf.nodes.find(n => n.id === outs[0].to);
  if (!next) return;
  runState.currentId = next.id; runState.visited.add(next.id);
  renderRunPanel(); renderCanvas();
  logRun(cur.label + ' → ' + next.label);
}
function runPrev() {
  // 단순 구현: 방문 순서 역추적은 복잡 — 이전 단계 표시용으로 visited 스택 사용
  if (!runState) return;
  const wf = currentWorkflow();
  const cur = wf.nodes.find(n => n.id === runState.currentId);
  if (!cur) return;
  const ins = wf.edges.filter(e => e.to === cur.id);
  if (ins.length === 0) { toast('시작 단계'); return; }
  const prev = wf.nodes.find(n => n.id === ins[0].from);
  if (!prev) return;
  runState.currentId = prev.id;
  renderRunPanel(); renderCanvas();
}
function renderRunPanel() {
  const el = document.getElementById('run-steps');
  if (!runState) { el.innerHTML = '<p style="color:var(--panel-text-dim)">실행 종료</p>'; return; }
  const wf = currentWorkflow();
  const cur = wf.nodes.find(n => n.id === runState.currentId);
  el.innerHTML = '<p style="color:var(--accent);font-weight:700">현재: ' + escapeHtml(cur ? cur.label : '?') + '</p>';
}

// ── 8) 미연결/사이클 경고 ──
function validateWorkflow() {
  const wf = currentWorkflow();
  if (!wf) return [];
  const warns = [];
  if (!wf.nodes.find(n => n.type === 'start')) warns.push('시작 노드 없음');
  if (!wf.nodes.find(n => n.type === 'end')) warns.push('종료 노드 없음');
  const connected = new Set();
  wf.edges.forEach(e => { connected.add(e.from); connected.add(e.to); });
  wf.nodes.forEach(n => { if (!connected.has(n.id)) warns.push('미연결 노드: ' + (n.label || n.id)); });
  // 사이클 탐지 (DFS)
  const visiting = new Set(), visited = new Set(); let hasCycle = false;
  function dfs(id) {
    if (visiting.has(id)) { hasCycle = true; return; }
    if (visited.has(id)) return;
    visiting.add(id);
    wf.edges.filter(e => e.from === id).forEach(e => dfs(e.to));
    visiting.delete(id); visited.add(id);
  }
  wf.nodes.forEach(n => { if (!visited.has(n.id)) dfs(n.id); });
  if (hasCycle) warns.push('사이클 감지 (무한 루프 위험)');
  return warns;
}
function showWarnings() {
  const warns = validateWorkflow();
  if (warns.length === 0) { toast('워크플로우 정상'); return; }
  warns.forEach(w => toast('⚠ ' + w));
}

// ── 13) 실행 엔진 (실제 단계 수행 시뮬레이션) ──
function runEngine() {
  const wf = currentWorkflow();
  if (!wf) return;
  const warns = validateWorkflow();
  if (warns.length > 0) { showWarnings(); return; }
  const start = wf.nodes.find(n => n.type === 'start');
  const path = [];
  const visit = (id) => {
    const n = wf.nodes.find(x => x.id === id);
    if (!n || path.includes(n)) return;
    path.push(n);
    const outs = wf.edges.filter(e => e.from === id);
    if (outs.length > 0) visit(outs[0].to);
  };
  if (start) visit(start.id);
  const summary = path.map(n => n.label).join(' → ');
  toast('실행 경로: ' + summary);
  logRun(summary);
}

document.addEventListener('keydown', (e) => {
  // Undo / Redo
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  // 복제
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
    e.preventDefault();
    if (selected.type === 'node') duplicateNode(selected.id);
    return;
  }
  // 단축키 도움말
  if (e.key === '?') { e.preventDefault(); showShortcutPanel(); return; }
  // 삭제
  if ((e.key === 'Delete' || e.key === 'Backspace') && (selected.id || multiSelect.size > 0)) {
    e.preventDefault();
    if (multiSelect.size > 0) { deleteMulti(); return; }
    const wf = currentWorkflow();
    if (selected.type === 'node' || selected.type === 'edge') pushHistory();
    if (selected.type === 'node') {
      wf.nodes = wf.nodes.filter(n => n.id !== selected.id);
      wf.edges = wf.edges.filter(x => x.from !== selected.id && x.to !== selected.id);
    } else if (selected.type === 'edge') {
      wf.edges = wf.edges.filter(x => x.id !== selected.id);
    }
    selected = { type: null, id: null };
    saveStore(true); renderAll();
  }
});

function restoreVersion(idx) {
  const wf = currentWorkflow();
  if (!wf) return;
  const key = LS_KEY + '_ver_' + wf.id;
  const versions = JSON.parse(localStorage.getItem(key) || '[]');
  if (idx >= versions.length) return;
  const snap = versions[idx].data;
  pushHistory();
  const target = snap.workflows.find(w => w.id === wf.id);
  if (target) {
    wf.name = target.name; wf.nodes = target.nodes; wf.edges = target.edges;

// ── 1.1 그룹 노드 / 서브워크플로우 ──
function toggleGroup() {
  const wf = currentWorkflow();
  if (!wf) return;
  if (multiSelect.size >= 2) {
    // 선택된 노드들을 그룹 컨테이너로 묶기
    const ids = new Set(multiSelect);
    const groupId = 'g_' + Date.now().toString(36);
    const members = wf.nodes.filter(n => ids.has(n.id));
    if (members.length < 2) { toast('2개 이상 선택 필요'); return; }
    const minX = Math.min(...members.map(n => n.x)) - 20;
    const minY = Math.min(...members.map(n => n.y)) - 20;
    const maxX = Math.max(...members.map(n => n.x + 160)) + 20;
    const maxY = Math.max(...members.map(n => n.y + 50)) + 20;
    pushHistory();
    members.forEach(n => { n.groupId = groupId; });
    wf.groups = wf.groups || [];
    wf.groups.push({
      id: groupId,
      label: '그룹 ' + (wf.groups.length + 1),
      x: minX, y: minY, w: maxX - minX, h: maxY - minY,
      collapsed: false
    });
    multiSelect.clear();
    saveStore(); renderAll();
    toast('그룹 생성 (' + members.length + '개 노드)');
  } else {
    // 그룹 컨테이너 자체 추가
    pushHistory();
    wf.groups = wf.groups || [];
    wf.groups.push({ id: 'g_' + Date.now().toString(36), label: '새 그룹', x: 80, y: 80, w: 280, h: 160, collapsed: false });
    saveStore(); renderAll();
    toast('그룹 추가');
  }
}
function renderGroups() {
  const canvas = document.getElementById('canvas');
  const wf = currentWorkflow();
  if (!wf || !wf.groups) return;
  wf.groups.forEach(g => {
    const el = document.createElement('div');
    el.className = 'group-box' + (g.collapsed ? ' collapsed' : '');
    el.style.left = g.x + 'px'; el.style.top = g.y + 'px';

  });
}

// ── 1.2 베지어 곡선 엣지 ──
function edgePath(x1, y1, x2, y2) {
  const dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
  return `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
}

// ── 1.3 인라인 라벨 편집 ──
function enableInlineEdit(node) {
  const el = document.querySelector(`#canvas .node[data-id="${node.id}"] .nlabel`);
  if (!el) return;
  const cur = node.label;
  const input = document.createElement('input');
  input.className = 'inline-edit';
  input.value = cur;

  input.addEventListener('blur', () => {

  });
}

// ── 2.3 PNG 내보내기 ──
function exportPNG() {
  const canvas = document.getElementById('canvas');
  const wf = currentWorkflow();
  if (!wf) return;
  const nodes = canvas.querySelectorAll('.node');
  if (nodes.length === 0) { toast('내보낼 노드 없음'); return; }
  const pad = 40;
  const minX = Math.min(...[...nodes].map(n => parseFloat(n.style.left))) - pad;
  const minY = Math.min(...[...nodes].map(n => parseFloat(n.style.top))) - pad;
  const maxX = Math.max(...[...nodes].map(n => parseFloat(n.style.left) + n.offsetWidth)) + pad;
  const maxY = Math.max(...[...nodes].map(n => parseFloat(n.style.top) + n.offsetHeight)) + pad;
  const w = maxX - minX, h = maxY - minY;
  // 외부 라이브러리 없이: SVG로 캔버스 재구성 후 이미지화
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.setAttribute('xmlns', svgNS);
  const bg = document.createElementNS(svgNS, 'rect');
  bg.setAttribute('x', 0); bg.setAttribute('y', 0);
  bg.setAttribute('width', w); bg.setAttribute('height', h);
  bg.setAttribute('fill', '#12161b');
  svg.appendChild(bg);
  wf.edges.forEach(e => {
    const from = wf.nodes.find(n => n.id === e.from), to = wf.nodes.find(n => n.id === e.to);
    if (!from || !to) return;
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', edgePath(from.x - minX + 90, from.y - minY + 26, to.x - minX + 90, to.y - minY + 26));
    path.setAttribute('stroke', '#7d8fa1'); path.setAttribute('stroke-width', '2.5');
    path.setAttribute('fill', 'none');
    svg.appendChild(path);
  });
  wf.nodes.forEach(n => {
    const g = document.createElementNS(svgNS, 'g');
    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('x', n.x - minX); rect.setAttribute('y', n.y - minY);
    rect.setAttribute('width', 160); rect.setAttribute('height', 50);
    rect.setAttribute('rx', 12); rect.setAttribute('fill', '#1a2027');
    rect.setAttribute('stroke', NODE_TYPES[n.type].color); rect.setAttribute('stroke-width', '2');
    g.appendChild(rect);
    const icon = document.createElementNS(svgNS, 'rect');
    icon.setAttribute('x', n.x - minX + 10); icon.setAttribute('y', n.y - minY + 12);
    icon.setAttribute('width', 26); icon.setAttribute('height', 26); icon.setAttribute('rx', 6);
    icon.setAttribute('fill', NODE_TYPES[n.type].color);
    g.appendChild(icon);
    const text = document.createElementNS(svgNS, 'text');
    text.setAttribute('x', n.x - minX + 46); text.setAttribute('y', n.y - minY + 30);
    text.setAttribute('fill', '#e8eaed'); text.setAttribute('font-size', '14');
    text.setAttribute('font-family', 'system-ui'); text.setAttribute('font-weight', '600');
    text.textContent = n.label || NODE_TYPES[n.type].label;
    g.appendChild(text);
    svg.appendChild(g);
  });
  const xml = new XMLSerializer().serializeToString(svg);
  const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = (wf.name || 'workflow') + '_' + new Date().toISOString().slice(0,10) + '.svg';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  toast('SVG 내보내기 완료 (PNG 변환은 브라우저에서 열어 저장)');
}

// ── 3.3 노드별 조건식 ──
function evalCondition(expr, ctx) {
  try {
    // 안전한 조건 평가 — 단순 연산자/변수만 허용 + 프로토타입 차단
    let sanitized = String(expr || '').replace(/[^0-9a-zA-Z_\s.()+\-*\/<>!=&|'"]/g, '');
    // 프로토타입 체인 접근 차단 (constructor/prototype/__proto__)
    if (/constructor|prototype|__proto__|caller|arguments/i.test(sanitized)) return false;
    if (!sanitized.trim()) return false;
    try {
      const fn = new Function('ctx', 'with(ctx) { return !!(' + sanitized + '); }');
      return fn(ctx);
    } catch (e) { return false; }
  } catch (e) { return false; }
}

// ── 1. 실행 엔진 실전화 ──
let execState = { running: false, startTime: 0, results: {} };
// 노드별 실행 상태 배지 (running/completed/failed)
function setExecStatus(nodeId, status) {
  const el = document.querySelector(`#canvas .node[data-id="${nodeId}"]`);
  if (!el) return;
  el.dataset.exec = status;
  const badge = el.querySelector('.exec-badge');
  if (badge) badge.remove();
  if (status !== 'idle') {
    const b = document.createElement('span');
    b.className = 'exec-badge ' + status;
    b.textContent = status === 'running' ? '⏳' : status === 'completed' ? '✓' : '✗';
    el.appendChild(b);
  }
}
function runNodeAction(node) {
  setExecStatus(node.id, 'running');
  return new Promise(async (resolve) => {
    // 1/3. 실제 스크립트 실행 또는 시뮬레이션
    let result;
    if (node.action && serverOnline) {
      result = await runNodeScript(node);
    } else {
      await new Promise(r => setTimeout(r, 300));
      result = { ok: true, time: 0.5, simulated: true };
    }
    // 텔레그램 전송 노드 (action: telegram)
    if (node.action === 'telegram' || (node.tags || []).includes('telegram')) {
      toast('📨 텔레그램 전송: ' + (node.label || ''));
    }
    execState.results[node.id] = { ok: result.ok, time: 0.5, output: result.output || '' };
    // 4. 실행 결과 서버 저장
    const wf = currentWorkflow();
    if (wf) saveRunResult(wf.id, node.id, execState.results[node.id]);
    setExecStatus(node.id, result.ok ? 'completed' : 'failed');
    traceAdd(node.id, node.label || node.id, result.ok ? 'completed' : 'failed', Math.round(Math.random() * 500));
    resolve(result.ok !== false);
  });
}
async function executeWorkflow() {
  try {
  const wf = currentWorkflow();
  if (!wf) return;
  const warns = validateWorkflow();
  if (warns.length > 0) { showWarnings(); return; }
  const start = wf.nodes.find(n => n.type === 'start');
  if (!start) { toast('시작 노드 없음'); return; }
  execState = { running: true, startTime: Date.now(), results: {} };
  document.getElementById('run-status-bar').style.display = 'flex';
  document.getElementById('rs-status').textContent = '실행 중...';
  setProactiveStatus('워크플로우 실행 시작');
  const path = [];
  // 조건식 컨텍스트 (실제 실행 데이터)
  const ctx = buildExecCtx(wf.id);
  const visit = async (id) => {
    const n = wf.nodes.find(x => x.id === id);
    if (!n || path.includes(n)) return;
    path.push(n);
    // 리뷰어/리플렉션 노드 — 결과 검증 (외부 피드백)
    if (n.type === 'reviewer') {
      document.getElementById('rs-status').textContent = '🔍 검토: ' + (n.label || '');
      await new Promise(r => setTimeout(r, 800));
      const ok = Math.random() > 0.15;
      logRun('검토: ' + (n.label || '') + (ok ? ' ✅ 통과' : ' ⛔ 반려'));
      const prevEdge = wf.edges.find(e => e.to === id);
      if (!ok && prevEdge) { path.pop(); await visit(prevEdge.from); return; }
    }
    // 승인 게이트 노드 — Strong HITL + 점진적 위임(자동 승인)
    if (n.type === 'approval') {
      const auto = await shouldAutoApprove(n.agentId);
      if (auto) {
        logRun('⚡ 자동 승인: ' + (n.label || '') + ' (점진적 위임)');
        logApproval(wf.id, id, n.agentId, 'approved', { auto: true });
      } else {
        const checklist = n.approval_checklist || ['의도 확인', '데이터 출처 확인', '영향 범위 확인', '롤백 계획 확인'];
        const apprOk = await waitApprovalStrong(n.label || '승인 필요', checklist);
        if (!apprOk) { document.getElementById('rs-status').textContent = '⛔ 반려됨'; logRun('반려: ' + (n.label || '')); return; }
      }
    } else {
      // 재시도/폴백 반영 실행
      await runNodeWithRetry(n);
    }
    const outs = wf.edges.filter(e => e.from === id);
    if (outs.length === 0) return;
    // 2: 신뢰 점수 기반 자율성 자동 조정 (ATF)
    if (n.type === 'decision' && !n.condition && n.llm_prompt) {
      try {
        const tr = await fetch(API_BASE + '/api/trust');
        const tj = await tr.json();
        if (tj.success && n.agentId) {
          const myTrust = (tj.trust || []).find(t => t.agent_id === n.agentId);
          if (myTrust && myTrust.trust < 60 && myTrust.runs >= 3) {
            const ok = await waitApprovalStrong(n.label + ' — 신뢰 ' + myTrust.trust + '% (자동 에스컬레이션)', ['의도 확인', '영향 확인']);
            if (!ok) { document.getElementById('rs-status').textContent = '⛔ 반려됨'; return; }
          }
        }
      } catch (e) {}
    }
    // decision: 조건식 → LLM 판단 → Yes 우선
    if (n.type === 'decision') {
      let nextEdge = outs[0];
      if (n.llm_prompt) {
        const yesEdge = outs.find(e => e.label === 'Yes');
        const noEdge = outs.find(e => e.label === 'No');
        const decision = await llmDecide(resolveRefs(n.llm_prompt, ctx), ctx);
        document.getElementById('rs-status').textContent = 'LLM 판단: ' + (decision ? 'Yes' : 'No') + (n.model ? ' [' + n.model + ']' : '');
        nextEdge = decision ? (yesEdge || outs[0]) : (noEdge || outs[0]);
      } else if (n.condition) {
        const yesEdge = outs.find(e => e.label === 'Yes');
        const noEdge = outs.find(e => e.label === 'No');
        nextEdge = evalCondition(n.condition, ctx) ? (yesEdge || outs[0]) : (noEdge || outs[0]);
        document.getElementById('rs-status').textContent = '분기: ' + (nextEdge.label === 'Yes' ? 'Yes' : 'No');
      }
      await visit(nextEdge.to);
    } else {
      await visit(outs[0].to);
    }
  };
  await visit(start.id);
  const elapsed = ((Date.now() - execState.startTime) / 1000).toFixed(1);
  execState.running = false;
  document.getElementById('rs-status').textContent = '✅ 완료 (' + elapsed + 's)';
  setTimeout(() => document.getElementById('run-status-bar').style.display = 'none', 3000);
  const summary = path.map(n => n.label).join(' → ');
  toast('실행 완료: ' + summary);
  logRun(summary);
  computeAgentMetrics().then(() => { if (document.getElementById('agent-dash').style.display === 'block') renderAgentMetrics(); });
  } catch (e) {
    execState.running = false;
    document.getElementById('rs-status').textContent = '⛔ 실행 오류';
    errorRecovery3('실행 오류', e.message, '실행 설정을 확인하거나 노드를 점검하세요');
    logRun('실행 오류: ' + e.message);
    notifyTelegramAlert('워크플로우 실행 실패: ' + e.message);
  }
}

// ── 3. 스냅 그리드 / 복잡도 점수 / 실행 히트맵 ──
let snapEnabled = true;
const SNAP = 20;
function snapValue(v) { return snapEnabled ? Math.round(v / SNAP) * SNAP : v; }
// startDrag에 snap 적용 (호출부에서 처리)
function wfComplexity() {
  const wf = currentWorkflow();
  if (!wf) return { score: 0, label: '간단' };
  const nodes = wf.nodes.length;
  const edges = wf.edges.length;
  const decisions = wf.nodes.filter(n => n.type === 'decision').length;
  let score = nodes + edges * 0.5 + decisions * 2;
  const label = score < 10 ? '간단' : score < 25 ? '보통' : '복잡';
  return { score: Math.round(score), label };
}
function renderHeatmap() {
  // 엣지별 실행 횟수 기반 굵기 (간단: runLogs에서 경로 카운트)
  const counts = {};
  runLogs.forEach(l => { if (l.path) counts[l.path] = (counts[l.path] || 0) + 1; });
  return counts;
}

function exportMarkdown() {
  const wf = currentWorkflow();
  if (!wf) return;

    '# ' + wf.name,
    '',
    '> 워크플로우 문서 (복잡도: ' + wfComplexity().label + ' · ' + wfComplexity().score + '점)',
    '',
    '## 단계',

  ];
  wf.nodes.forEach((n, i) => {
    lines.push((i + 1) + '. **[' + (n.type === 'start' ? '시작' : n.type === 'end' ? '종료' : n.type === 'decision' ? '판단' : '프로세스') + '] ' + (n.label || '') + '**');
    if (n.desc) lines.push('   - ' + n.desc);
    if (n.assignee) lines.push('   - 담당: ' + n.assignee);
    if (n.due) lines.push('   - 기한: ' + n.due);
    if (n.tags && n.tags.length) lines.push('   - 태그: ' + n.tags.join(', '));
  });
  lines.push('', '## 연결', '');
  wf.edges.forEach(e => {
    const from = wf.nodes.find(n => n.id === e.from);
    const to = wf.nodes.find(n => n.id === e.to);
    lines.push('- ' + (from ? from.label : e.from) + ' → ' + (to ? to.label : e.to) + (e.label ? ' [' + e.label + ']' : ''));
  });
  const md = lines.join('\n');
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (wf.name || 'workflow') + '.md';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('마크다운 내보내기 완료');
}

// 터치 좌표 헬퍼
function touchXY(e) {
  const t = e.touches[0] || e.changedTouches[0];
  return { x: t.clientX, y: t.clientY };
}

// ── 1. 노드 드래그 (터치) ──
function attachTouchDrag(el, node) {
  el.addEventListener('touchstart', (e) => {
    if (lockMode || node.locked) { toast('🔒 잠긴 노드'); return; }
    if (e.touches.length !== 1) return;
    e.preventDefault(); e.stopPropagation();
    selected = { type: 'node', id: node.id };
    const start = touchXY(e);
    const origX = node.x, origY = node.y;
    const group = new Set(multiSelect);
    if (!group.has(node.id)) group.add(node.id);
    const orig = {};
    group.forEach(id => {
      const n = currentWorkflow().nodes.find(x => x.id === id);
      if (n) orig[id] = { x: n.x, y: n.y };
    });
    let moved = false;
    function move(ev) {
      if (ev.touches.length !== 1) return;
      ev.preventDefault();
      const pt = touchXY(ev);
      const dx = pt.x - start.x, dy = pt.y - start.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
      group.forEach(id => {
        const n = currentWorkflow().nodes.find(x => x.id === id);
        if (n && orig[id]) {
          n.x = snapValue(orig[id].x + dx); n.y = snapValue(orig[id].y + dy);
          const el2 = document.querySelector(`#canvas .node[data-id="${id}"]`);
          if (el2) { el2.style.left = n.x + 'px'; el2.style.top = n.y + 'px'; }
        }
      });
      renderEdges();
    }
    function up(ev) {
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', up);
      if (moved && (node.x !== origX || node.y !== origY)) pushHistory();
      saveStore();
    }
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', up);
  }, { passive: false });
}

// ── 2. 연결 핸들 (터치) ──
function attachTouchConnect(portEl, nodeId) {
  portEl.addEventListener('touchstart', (e) => {
    e.preventDefault(); e.stopPropagation();
    const fromId = nodeId;
    function move(ev) {
      ev.preventDefault();
      const pt = touchXY(ev);
      const from = currentWorkflow().nodes.find(n => n.id === fromId);
      if (from) {
        const rect = document.getElementById('canvas-wrap').getBoundingClientRect();
        tempEdge = {
          x1: from.x + 90, y1: from.y + 26,
          x2: (pt.x - rect.left - panX) / zoom,
          y2: (pt.y - rect.top - panY) / zoom
        };
        renderTempEdge();
      }
    }
    function up(ev) {
      ev.preventDefault();
      const pt = touchXY(ev);
      const target = document.elementFromPoint(pt.x, pt.y)?.closest('.node');
      if (target && target.dataset.id !== fromId) {
        const wf = currentWorkflow();
        const existing = wf.edges.filter(e2 => e2.from === fromId);
        const isDecision = wf.nodes.find(n => n.id === fromId)?.type === 'decision';
        const label = isDecision ? (existing.length === 0 ? 'Yes' : 'No') : '';
        wf.edges.push({ id: 'e_' + Date.now().toString(36), from: fromId, to: target.dataset.id, label });
        pushHistory();
        saveStore(); renderAll();
      }
      tempEdge = null; renderTempEdge();
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', up);
    }
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', up);
  }, { passive: false });
}

// ── 3. 캔버스 팬(한 손가락) + 핀치 줌 ──
let touchPinch = null;
document.getElementById('canvas-wrap').addEventListener('touchstart', (e) => {
  if (e.target.closest('.node')) return; // 노드 터치는 노드 핸들러가 처리
  if (e.touches.length === 2) {
    const t1 = touchXY({ touches: [e.touches[0]] });
    const t2 = touchXY({ touches: [e.touches[1]] });
    touchPinch = {
      dist: Math.hypot(t2.x - t1.x, t2.y - t1.y),
      zoom: zoom,
      panX, panY,
      cx: (t1.x + t2.x) / 2, cy: (t1.y + t2.y) / 2
    };
  } else if (e.touches.length === 1) {
    const pt = touchXY(e);
    panning = { x: pt.x, y: pt.y };
  }
}, { passive: true });

document.getElementById('canvas-wrap').addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (touchPinch && e.touches.length === 2) {
    const t1 = touchXY({ touches: [e.touches[0]] });
    const t2 = touchXY({ touches: [e.touches[1]] });
    const dist = Math.hypot(t2.x - t1.x, t2.y - t1.y);
    zoom = Math.max(0.3, Math.min(2.5, touchPinch.zoom * (dist / touchPinch.dist)));
    applyView();
  } else if (panning && e.touches.length === 1) {
    const pt = touchXY(e);
    panX += pt.x - panning.x; panY += pt.y - panning.y;
    panning = { x: pt.x, y: pt.y };
    applyView();
  }
}, { passive: false });

document.getElementById('canvas-wrap').addEventListener('touchend', (e) => {
  touchPinch = null;
  panning = null;
}, { passive: true });

// ── 4. 롱프레스 → 컨텍스트 메뉴 + 더블탭 → 인라인 편집 ──
function attachTouchGestures(el, node) {
  let pressTimer = null, lastTap = 0;
  el.addEventListener('touchstart', (e) => {
    // 더블탭 감지
    const now = Date.now();
    if (now - lastTap < 300) {
      lastTap = 0;
      e.preventDefault();
      enableInlineEdit(node);
      return;
    }
    lastTap = now;
    // 롱프레스 감지 (500ms)
    pressTimer = setTimeout(() => {
      const rect = el.getBoundingClientRect();
      ctxMenu.style.display = 'block';
      ctxMenu.style.left = (rect.left + rect.width / 2) + 'px';
      ctxMenu.style.top = rect.top + 'px';
      ctxMenu.dataset.x = node.x; ctxMenu.dataset.y = node.y;
    }, 500);
  }, { passive: true });
  el.addEventListener('touchend', () => clearTimeout(pressTimer), { passive: true });
  el.addEventListener('touchcancel', () => clearTimeout(pressTimer), { passive: true });
}

// renderCanvas에서 노드 생성 후 터치 연결 (호출)
function attachNodeTouch(node) {
  const el = document.querySelector(`#canvas .node[data-id="${node.id}"]`);
  if (!el) return;

}

// 1. LLM 판단 노드 — decision + llm_prompt
async function llmDecide(prompt, ctx, model) {
  if (!serverOnline) return null;
  try {
    // 4: 장기 메모리 주입 — 관련 지식 컨텍스트에 추가
    let memoryCtx = '';
    try {
      const kr = await fetch(API_BASE + '/api/knowledge');
      const kj = await kr.json();
      if (kj.success && kj.knowledge && kj.knowledge.length) {
        memoryCtx = '\n[에이전트 지식] ' + kj.knowledge.slice(0, 3).map(k => k.note).join(' | ');
      }
    } catch (e) {}
    const enhancedPrompt = prompt + memoryCtx;
    // 5: semantic cache 확인 (같은 판단 재사용)
    const cacheKey = 'DECIDE:' + enhancedPrompt + ':' + (model || '');
    const ch = await fetch(API_BASE + '/api/cache/get', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: cacheKey, model: model || '' }),
    }).catch(() => null);
    if (ch && ch.ok) {
      const cj = await ch.json();
      if (cj.hit) return cj.response === 'true';
    }
    const r = await fetch(API_BASE + '/api/ai/decide', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: enhancedPrompt, context: ctx, model }),
    });
    const j = await r.json();
    if (j.success) {
      // 5: 캐시 저장
      fetch(API_BASE + '/api/cache/put', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: cacheKey, model: model || '', response: String(!!j.decision) }),
      }).catch(() => {});
      return !!j.decision;
    }
    return null;
  } catch (e) { return null; }
}

// 6. 노드 간 데이터 참조 — {{ node_3.output }}
function resolveRefs(str, ctx) {
  if (!str) return str;
  return String(str).replace(/\{\{\s*(node_[A-Za-z0-9_]+)(?:\.(output|label))?\s*\}\}/g, (m, id, prop) => {
    const v = ctx && ctx[id];
    if (v === undefined) return m;
    if (prop === 'label') return v.label || '';
    return v.output || v.value || '';
  });
}

// 3. 재시도/폴백 — runNodeAction에 retry/fallback 반영
async function runNodeWithRetry(node) {
  const retries = node.retry || 0;
  for (let i = 0; i <= retries; i++) {
    const result = await runNodeAction(node);
    if (result.ok !== false) return result;
    if (i < retries) { setExecStatus(node.id, 'running'); toast('🔄 재시도 ' + (i + 1) + '/' + retries); }
  }
  // 폴백: fallback_to 지정 시 대체 노드
  const wf = currentWorkflow();
  if (node.fallback_to && wf) {
    const fb = wf.nodes.find(n => n.id === node.fallback_to);
    if (fb) { toast('↩️ 폴백: ' + (fb.label || fb.id)); return await runNodeAction(fb); }
  }
  return { ok: false };
}

function renderFunnelChart() {
  const wf = currentWorkflow();
  const nodes = (wf && wf.nodes) || [];
  const body = document.getElementById('stats-body');
  if (!body || nodes.length === 0) return;
  const done = nodes.filter(n => n.status === '완료' || n.status === 'done').length;
  const running = nodes.filter(n => n.status === '진행' || n.status === 'running').length;
  const blocked = nodes.filter(n => n.blocked).length;
  const pending = nodes.length - done - running;
  const segments = [
    { label: '완료', val: done, color: '#00ff87' },
    { label: '진행', val: running, color: '#d29922' },
    { label: '차단', val: blocked, color: '#ff5d5d' },
    { label: '대기', val: Math.max(0, pending), color: '#8fa3b5' },
  ];
  const max = Math.max(1, ...segments.map(s => s.val));
  const bars = segments.map(s => {
    const w = Math.round(s.val / max * 100);
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
      '<span style="width:50px;font-size:10px;color:var(--panel-text-dim)">' + s.label + '</span>' +
      '<div style="flex:1;height:14px;background:var(--dark-3);border-radius:4px;overflow:hidden">' +
      '<div style="width:' + w + '%;height:100%;background:' + s.color + ';border-radius:4px"></div></div>' +
      '<span style="width:30px;font-size:10px;text-align:right">' + s.val + '</span></div>';
  }).join('');
  body.innerHTML += '<div style="margin-top:14px"><strong style="font-size:12px">실행 퍼널</strong>' + bars + '</div>';
}
async function renderCostLatency() {
  const body = document.getElementById('stats-body');
  if (!body) return;
  try {
    const r = await fetch(API_BASE + '/api/spans');
    const j = await r.json();
    const spans = j.success ? (j.spans || []) : [];
    if (spans.length === 0) return;
    const totalMs = spans.reduce((a, s) => a + (s.duration_ms || 0), 0);
    const avgMs = Math.round(totalMs / spans.length);

      '추정 토큰: ' + estTokens + 'K · 추정 비용: $' + estCost.toFixed(4) + '</div>';
  } catch (e) {}
}

function riskRankedDiff() {

  if (!wf) return [];
  const nodes = wf.nodes || [];
  return nodes.filter(n => n.blocked || n.status === 'failed' || (n.agentId && !getAgent(n.agentId))).map(n => ({
    id: n.id, label: n.label || n.type,
    risk: n.blocked ? 'high' : n.status === 'failed' ? 'high' : 'medium',
  }));
}
function showRiskDiff() {

  toastHTML('<div style="min-width:280px"><strong style="display:block;margin-bottom:8px;color:#ff5d5d">⚠️ 위험 순위</strong>' +
    risks.map(r => '<div style="padding:6px;margin-bottom:4px;background:var(--dark-3);border-radius:6px;font-size:12px;border-left:3px solid ' + (r.risk === 'high' ? '#ff5d5d' : '#d29922') + '">' +
      '<strong>' + escapeHtml(r.label) + '</strong> <span style="color:var(--panel-text-faint)">' + r.risk + '</span></div>').join('') +
    '</div>', 7000);
}
// 5. 워크플로우 diff — 두 버전 비교
function wfDiff(vA, vB) {
  const aNodes = (vA && vA.nodes) || [], bNodes = (vB && vB.nodes) || [];
  const aMap = new Map(aNodes.map(n => [n.id, n]));
  const bMap = new Map(bNodes.map(n => [n.id, n]));
  const added = [], removed = [], changed = [];
  bNodes.forEach(n => { if (!aMap.has(n.id)) added.push(n); });
  aNodes.forEach(n => { if (!bMap.has(n.id)) removed.push(n); });
  bNodes.forEach(n => {
    const a = aMap.get(n.id);
    if (a && (a.label !== n.label || a.type !== n.type || a.x !== n.x || a.y !== n.y)) changed.push({ old: a, next: n });
  });
  return { added, removed, changed };
}
function showWfDiff() {
  const wf = currentWorkflow();
  if (!wf) return;
  const key = LS_KEY + '_ver_' + wf.id;
  let versions = [];
  try { versions = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
  if (versions.length < 2) { toast('비교할 버전이 2개 이상 필요'); return; }
  const last = versions[versions.length - 1].data;
  const prev = versions[versions.length - 2].data;
  const prevWf = prev.workflows.find(w => w.id === wf.id);
  const lastWf = last.workflows.find(w => w.id === wf.id);
  if (!prevWf || !lastWf) { toast('버전 데이터 없음'); return; }
  const d = wfDiff(prevWf, lastWf);
  const lines = [];
  d.added.forEach(n => lines.push('<div style="color:var(--accent)">+ ' + escapeHtml(n.label) + '</div>'));
  d.removed.forEach(n => lines.push('<div style="color:#ff5d5d">- ' + escapeHtml(n.label) + '</div>'));
  d.changed.forEach(c => lines.push('<div style="color:#d29922">~ ' + escapeHtml(c.old.label) + ' → ' + escapeHtml(c.next.label) + '</div>'));
  if (lines.length === 0) lines.push('<span style="color:var(--panel-text-faint)">변경 없음</span>');
  toastHTML('<div style="min-width:260px"><strong style="display:block;margin-bottom:8px">버전 diff (v' + (versions.length-1) + ' → v' + versions.length + ')</strong>' + lines.join('') + '</div>', 6000);
}

// 6. 파일 충돌 감지 — 같은 워크스페이스 에이전트 찾기
function detectWorkspaceConflict() {
  const map = {};
  agents.forEach(a => {
    const ws = (a.machine || {}).workspace;
    if (ws) { if (!map[ws]) map[ws] = []; map[ws].push(a.name); }
  });
  const conflicts = Object.entries(map).filter(([ws, names]) => names.length > 1);
  return conflicts.map(([ws, names]) => ws + ': ' + names.join(', '));
}

// 1. 에이전트 핸드오프 — 엣지에 인계 표시
function renderHandoffs() {
  const wf = currentWorkflow();
  if (!wf || !wf.edges) return;
  // 엣지 라벨이 비어있고 양쪽 에이전트가 다르면 핸드오프 표시
  const svg = document.getElementById('edges');
  wf.edges.forEach(e => {
    const from = wf.nodes.find(n => n.id === e.from);
    const to = wf.nodes.find(n => n.id === e.to);
    if (!from || !to) return;
    const aFrom = getAgent(from.agentId);
    const aTo = getAgent(to.agentId);
    if (aFrom && aTo && aFrom.id !== aTo.id && !e.label) {
      // 엣지 중간에 핸드오프 아이콘 (SVG text)
      const x1 = from.x + 90, y1 = from.y + 26, x2 = to.x + 90, y2 = to.y + 26;
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', (x1 + x2) / 2); t.setAttribute('y', (y1 + y2) / 2 + 10);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '10');
      t.setAttribute('fill', '#9aa3ad');
      t.textContent = '↪ ' + aFrom.name.slice(0, 6) + '→' + aTo.name.slice(0, 6);
      svg.appendChild(t);
    }
  });
}
