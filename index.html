<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>워크플로우 빌더</title>
<style>
/* ═══ 최신 CSS 리빌드 — 디자인 토큰 + 현대 색상 공간 ═══ */
@layer reset, tokens, layout, components, utilities;

@layer tokens {
  :root {
    /* ── 강조색: #00ff87 민트 그린 ── */
    --accent: #00ff87;
    --accent-strong: #00d46f;
    --accent-soft: rgba(0,255,135,.14);
    --accent-glow: rgba(0,255,135,.35);

    /* ── 다크 / 화이트 교차 팔레트 ── */
    --dark: #0a0d10;
    --dark-2: #12161b;
    --dark-3: #1a2027;
    --dark-border: #232a33;
    --light: #f7f8fa;
    --light-2: #ffffff;
    --light-border: #e2e5ea;

    /* 전면 다크: 모든 패널 + 캔버스 통일 */
    --panel-bg: var(--dark);
    --panel-bg-2: var(--dark-2);
    --panel-border: var(--dark-border);
    --panel-text: #e8eaed;
    --panel-text-dim: #9aa3ad;
    --panel-text-faint: #6b7681;

    --canvas-bg: var(--dark);
    --canvas-grid: color-mix(in srgb, var(--accent) 7%, transparent);

    /* 노드 (다크 캔버스 위 = 다크 카드) */
    --node-bg: var(--dark-2);
    --node-border: var(--dark-border);
    --node-text: #e8eaed;

    /* 공용 */
    --danger: #ff5d5d;
    --danger-soft: rgba(255,93,93,.12);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.1);
    --shadow-md: 0 6px 24px rgba(0,0,0,.28);
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --topbar-h: 52px; --sidebar-w: 240px; --inspector-w: 280px;
    --font: system-ui, 'Pretendard', -apple-system, sans-serif;
  }
}

@layer reset {
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  button,input,textarea{font:inherit;color:inherit}
}

@layer layout {
  body{
    font-family:var(--font);
    background:var(--dark);
    color:var(--panel-text);
    height:100dvh;
    display:flex;flex-direction:column;overflow:hidden;
    scrollbar-gutter:stable;
    overscroll-behavior:none;
  }
  #canvas-wrap,#canvas{touch-action:none}
  #canvas .node{touch-action:none}
  #canvas .node .nport{touch-action:none}
  #topbar{
    height:var(--topbar-h);
    background:var(--panel-bg);
    border-block-end:1px solid var(--panel-border);
    display:flex;align-items:center;
    padding-inline:var(--space-4);
    gap:var(--space-3);flex-shrink:0;
    position:relative;z-index:20;
    backdrop-filter:blur(12px);
    background:color-mix(in srgb, var(--panel-bg) 88%, transparent);
  }
  #app{flex:1;display:flex;min-height:0}
  #sidebar{
    width:var(--sidebar-w);
    background:var(--panel-bg-2);
    border-inline-end:1px solid var(--panel-border);
    flex-shrink:0;display:flex;flex-direction:column;
  }
  #canvas-wrap{
    flex:1;position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 20% 30%, var(--canvas-grid), transparent 45%),
      var(--canvas-bg);
    container-type:inline-size;
  }
  #canvas{position:absolute;inset:0}
  #inspector{
    width:var(--inspector-w);
    background:var(--panel-bg-2);
    border-inline-start:1px solid var(--panel-border);
    flex-shrink:0;overflow-y:auto;
  }
}

@layer components {
  /* 사이드바 */
  #wf-list{list-style:none;padding:var(--space-2);overflow-y:auto;flex:1}
  #wf-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:var(--space-2) var(--space-3);
    border-radius:var(--radius-sm);
    cursor:pointer;font-size:14px;margin-block-end:var(--space-1);
    color:var(--panel-text-dim);
    transition:background .15s ease, color .15s ease;
  }
  #wf-list li:hover{background:var(--dark-3);color:var(--panel-text)}
  #wf-list li.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #wf-list .wf-del{border:none;background:none;font-size:16px;color:var(--panel-text-faint);cursor:pointer;padding-inline:var(--space-1)}
  #wf-list .wf-del:hover{color:var(--danger)}
  #add-wf{
    margin:var(--space-2) var(--space-3);
    padding:var(--space-3);
    border:1px dashed var(--dark-border);
    border-radius:var(--radius-md);
    background:none;cursor:pointer;font-size:14px;
    color:var(--panel-text-dim);
    transition:border-color .15s, background .15s, color .15s;
  }
  #add-wf:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

  /* 노드 — 라이트 표면 (다크 캔버스 대비 아님, 라이트 캔버스 위) */
  #canvas .node{
    position:absolute;min-width:160px;padding:10px 14px;
    background:var(--node-bg);
    border:2px solid var(--node-border);
    border-radius:var(--radius-md);
    cursor:grab;user-select:none;
    display:flex;align-items:center;gap:var(--space-2);
    box-shadow:var(--shadow-sm);
    z-index:1;
    color:var(--node-text);
    transition:border-color .15s ease, box-shadow .15s ease, background .15s;
  }
  #canvas .node:hover{background:var(--dark-3)}
  #canvas .node:hover{border-color:color-mix(in srgb, var(--accent) 60%, var(--node-border))}
  #canvas .node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft), 0 0 18px var(--accent-glow)}
  #canvas .node:has(.nport:active){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft), 0 0 18px var(--accent-glow)}
  #canvas .node .nicon{
    width:26px;height:26px;border-radius:var(--radius-sm);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:14px;flex-shrink:0;aspect-ratio:1;
  }
  #canvas .node .nlabel{
    font-size:14px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-wrap:balance;
  }
  #canvas .node .nport{
    position:absolute;inset-inline-end:-4px;top:50%;translate:0 -50%;
    width:18px;height:18px;border-radius:50%;
    background:var(--accent);
    border:3px solid var(--node-bg);
    cursor:crosshair;opacity:0;transition:opacity .15s, scale .15s;
    z-index:5;pointer-events:auto;
    box-shadow:0 0 10px var(--accent-glow);
  }
  #canvas .node .nport:hover{scale:1.3;background:var(--accent-strong)}
  #canvas .node:hover .nport{opacity:1}
  #canvas .node .nport:hover{scale:1.3}

  /* 엣지 — 다크 캔버스에서 가시성 개선 */
  #edges{position:absolute;inset:0;pointer-events:none;z-index:0}
  #edges line{pointer-events:stroke;stroke:#7d8fa1 !important;stroke-width:2.5}
  #edges text{fill:var(--accent) !important}

  /* 인스펙터 */
  #inspector h3{font-size:14px;padding:14px var(--space-4) var(--space-2);border-block-end:1px solid var(--panel-border);color:var(--panel-text)}
  #inspector-body{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
  #inspector label{font-size:12px;color:var(--panel-text-dim);margin-block-start:var(--space-2)}
  #inspector input,#inspector textarea{
    width:100%;padding:var(--space-2);
    background:var(--dark-3);
    border:1px solid var(--dark-border);
    border-radius:var(--radius-sm);
    font-size:13px;font-family:inherit;
    color:var(--panel-text);
    transition:border-color .15s, box-shadow .15s;
  }
  #inspector input:focus-visible,#inspector textarea:focus-visible{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);
  }
  #inspector button{margin-block-start:var(--space-3);padding:9px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px}
  #f-del-node,#f-del-edge{background:var(--danger-soft);color:var(--danger)}

  /* 컨텍스트 메뉴 */
  #ctx-menu{
    position:fixed;display:none;z-index:50;
    background:var(--dark-2);
    border:1px solid var(--dark-border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-md);
    padding:var(--space-1);
    backdrop-filter:blur(8px);
    background:color-mix(in srgb, var(--dark-2) 92%, transparent);
  }
  #ctx-menu button{
    display:block;width:100%;text-align:left;
    padding:var(--space-2) var(--space-3);
    border:none;background:none;cursor:pointer;font-size:13px;border-radius:var(--radius-sm);
    color:var(--panel-text);
    transition:background .12s, color .12s;
  }
  #ctx-menu button:hover{background:var(--dark-3);color:var(--accent)}
}

@layer utilities {
  #topbar button{
    padding:7px 14px;
    background:transparent;
    border:1px solid var(--dark-border);
    border-radius:var(--radius-sm);
    color:var(--panel-text);
    cursor:pointer;font-size:13px;
    transition:border-color .15s, background .15s, color .15s, translate .15s;
  }
  #topbar button:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  /* 우상단 내보내기/가져오기 — #00ff87 강조 버튼 */
  #topbar button.tb-action{
    background:var(--accent);
    border:1px solid var(--accent);
    color:#04100a;
    font-weight:700;
    box-shadow:0 0 12px var(--accent-glow);
  }
  #topbar button.tb-action:hover{
    background:var(--accent-strong);
    border-color:var(--accent-strong);
    color:#04100a;
    box-shadow:0 0 18px var(--accent-glow);
  }
  #topbar button:active{translate:0 1px}
  #topbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  #topbar input#wf-name{
    background:var(--dark-2);
    border:1px solid var(--dark-border);
    border-radius:var(--radius-sm);
    color:var(--panel-text);
    padding:7px 12px;font-size:13px;
  }
  #topbar input#wf-name:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

  @container (max-width: 480px){
    #canvas .node{min-width:130px;padding:8px 10px}
    #canvas .node .nlabel{font-size:12px}
  }

  @media(max-width:900px){
    #sidebar{position:absolute;z-index:10;height:100%;translate:-100% 0;transition:translate .2s ease}
    #sidebar.open{translate:0 0}
    #inspector{position:absolute;inset-inline-end:0;z-index:10;height:100%;translate:100% 0;transition:translate .2s ease}
    #inspector.open{translate:0 0}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }

  /* ═══ 모바일 최적화 ═══ */
  #mobile-actions{display:none}
  .mm-item{display:block;width:100%;text-align:left;padding:12px 14px;border:none;background:none;color:var(--panel-text);cursor:pointer;font-size:14px;border-radius:10px}
  .mm-item:hover{background:var(--dark-3);color:var(--accent)}

  @media (max-width: 768px){
    /* 상단바 축소: wf-name/검색은 숨기고 나머지 버튼은 하단으로 */
    #topbar{height:48px;padding-inline:10px;gap:8px}
    #topbar input#wf-name{display:none}
    #topbar input#wf-search{display:none}
    #topbar button:not(#sidebar-toggle){display:none}
    #sidebar-toggle{font-size:18px;padding:8px 10px}

    /* 하단 고정 액션 바 */
    #mobile-actions{
      display:flex;position:fixed;bottom:0;left:0;right:0;z-index:55;
      background:color-mix(in srgb, var(--dark-2) 92%, transparent);
      backdrop-filter:blur(10px);
      border-top:1px solid var(--dark-border);
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));
      gap:8px;justify-content:space-between;
    }
    #mobile-actions button{
      flex:1;padding:12px 6px;font-size:12px;white-space:nowrap;
      background:var(--dark-3);border:1px solid var(--dark-border);
      color:var(--panel-text);border-radius:10px;cursor:pointer;
      min-height:44px;  /* 터치 최적 크기 */
    }
    #mobile-actions button:active{background:var(--accent-soft);color:var(--accent)}
    #mobile-actions #m-btn-run{background:var(--accent);color:#04100a;font-weight:700;border-color:var(--accent)}

    /* 캔버스 하단 여백 — 하단바에 가려지지 않게 */
    #canvas-wrap{margin-bottom:0}
    #app{min-height:0}

    /* 인스펙터 — 하단 시트 스타일 */
    #inspector{
      width:100%;height:60vh;top:auto;bottom:0;
      border-radius:16px 16px 0 0;
      border-left:none;border-top:1px solid var(--dark-border);
    }
    #inspector{translate:0 100%}
    #inspector.open{translate:0 0}

    /* 사이드바 — 전체 높이 */
    #sidebar{width:240px;top:0;height:100%}

    /* 미니맵 — 하단바 위로 */
    #minimap{bottom:70px;right:12px;width:130px;height:90px}

    /* 토스트 — 하단바 위 */
    #toast-container{bottom:70px}

    /* 실행 상태 바 — 하단바 위 */
    #run-status-bar{bottom:64px}
  }
  /* 다크 스크롤바 */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--dark-border);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb, var(--accent) 40%, var(--dark-border))}

  /* 실행 미리보기 모드 */
  #run-overlay{
    position:fixed;inset:0;z-index:60;
    background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(3px);
  }
  #run-panel{
    background:var(--dark-2);border:1px solid var(--dark-border);
    border-radius:var(--radius-lg);padding:20px 24px;
    min-width:340px;box-shadow:var(--shadow-md);
    color:var(--panel-text);
  }
  #run-panel h4{color:var(--accent);margin-bottom:12px}
  #run-panel button{margin-top:8px}
  .node.run-current{
    border-color:var(--accent) !important;
    box-shadow:0 0 0 3px var(--accent-soft), 0 0 24px var(--accent-glow) !important;
    background:color-mix(in srgb, var(--accent) 12%, var(--dark-2)) !important;
  }
  .node.run-visited{border-color:color-mix(in srgb, var(--accent) 50%, var(--dark-border)) !important}

  /* 다중 선택 */
  #canvas .node.multi{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

  /* 미니맵 */
  #minimap{
    position:fixed;right:16px;bottom:16px;z-index:40;
    width:180px;height:120px;
    background:color-mix(in srgb, var(--dark-2) 92%, transparent);
    border:1px solid var(--dark-border);border-radius:var(--radius-md);
    overflow:hidden;pointer-events:none;
    backdrop-filter:blur(6px);
  }
  #minimap .mm-node{position:absolute;border-radius:50%;opacity:.9}
  #minimap .mm-node.type-start{background:var(--n-start)}
  #minimap .mm-node.type-process{background:var(--n-process)}
  #minimap .mm-node.type-decision{background:var(--n-decision)}
  #minimap .mm-node.type-end{background:var(--n-end)}

  /* 토스트 */
  #toast-container{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  .toast{
    background:var(--dark-2);border:1px solid var(--dark-border);
    color:var(--panel-text);border-radius:var(--radius-md);
    padding:12px 18px;font-size:13px;box-shadow:var(--shadow-md);
    opacity:0;translate:0 8px;transition:opacity .25s, translate .25s;
    max-width:520px;
  }
  .toast.show{opacity:1;translate:0 0}

  /* 템플릿 버튼 */
  .tpl-btn{
    display:block;width:100%;text-align:left;
    padding:8px 10px;margin-top:6px;
    background:var(--dark-3);border:1px solid var(--dark-border);
    border-radius:var(--radius-sm);color:var(--panel-text);
    cursor:pointer;font-size:12px;
    transition:border-color .15s, color .15s;
  }
  .tpl-btn:hover{border-color:var(--accent);color:var(--accent)}

  /* 그룹 노드 */
  .group-box{
    position:absolute;z-index:0;
    background:color-mix(in srgb, var(--accent) 4%, transparent);
    border:1px dashed color-mix(in srgb, var(--accent) 40%, transparent);
    border-radius:16px;pointer-events:none;
  }
  .group-box .g-label{
    position:absolute;top:-10px;left:12px;
    font-size:11px;color:var(--accent);
    background:var(--dark);padding:0 8px;border-radius:4px;
  }
  .group-box.collapsed{border-style:solid}

  /* 인라인 편집 */
  .inline-edit{
    background:var(--dark-3);border:1px solid var(--accent);
    border-radius:6px;color:var(--panel-text);
    font-size:14px;font-weight:600;padding:2px 6px;
    width:100%;font-family:inherit;outline:none;
  }

  /* AI 패널 */
  #ai-panel h4{color:var(--accent);margin-bottom:12px;font-size:15px}
  #ai-panel textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

  /* 실행 로그 패널 */
  #runlog-panel::-webkit-scrollbar{width:6px}
  #runlog-panel::-webkit-scrollbar-thumb{background:var(--dark-border);border-radius:3px}

  /* 엣지 path hover */
  #edges path{pointer-events:stroke;transition:stroke .15s}
  #edges path:hover{stroke:var(--accent) !important}

  /* 실행 상태 배지 */
  .exec-badge{
    position:absolute;top:-8px;right:-8px;
    width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;border:2px solid var(--dark);
    background:var(--dark-3);
  }
  .exec-badge.running{background:#d29922;color:#fff;animation:pulse 1s infinite}
  .exec-badge.completed{background:#2ea043;color:#fff}
  .exec-badge.failed{background:#d1242f;color:#fff}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  /* 노드 잠금 배지 */
  .lock-badge{
    position:absolute;top:-8px;left:-8px;font-size:11px;
    background:var(--dark-3);border:1px solid var(--dark-border);
    border-radius:50%;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;
  }

  /* 통계 패널 */
  #stats-panel h4{color:var(--accent);margin-bottom:8px}
  #stats-body{line-height:1.7}

  /* 실행 상태 바 */
  #run-status-bar{cursor:pointer}
  #run-status-bar span{white-space:nowrap}
  #rs-status{color:var(--accent);font-weight:700}
  #rs-time{color:var(--panel-text-faint)}
}

</style>
</head>
<body>
  <header id="topbar">
    <button id="sidebar-toggle">☰</button>
    <strong>워크플로우 빌더</strong>
    <input id="wf-name" placeholder="워크플로우 이름" style="flex:1;max-width:300px">
    <span id="save-status" style="font-size:12px;color:#888"></span>
    <span id="sync-status" style="font-size:12px;color:#888"></span>
    <input id="wf-search" placeholder="워크플로우 검색..." style="background:var(--dark-2);border:1px solid var(--dark-border);border-radius:8px;color:var(--panel-text);padding:7px 12px;font-size:13px;width:160px">
    <button id="btn-ai" class="tb-action">✨ AI 생성</button>
    <button id="btn-group" class="tb-action">그룹</button>
    <button id="btn-run" class="tb-action">▶ 실행</button>
    <button id="btn-align" class="tb-action">정렬</button>
    <button id="btn-template" class="tb-action">템플릿</button>
    <button id="btn-share" class="tb-action">공유</button>
    <button id="btn-version" class="tb-action">버전</button>
    <button id="btn-png" class="tb-action">PNG</button>
    <button id="btn-md" class="tb-action">MD</button>
    <button id="btn-stats" class="tb-action">통계</button>
    <button id="btn-lock" class="tb-action">🔒</button>
    <button id="btn-fav" class="tb-action">☆</button>
    <button id="btn-export" class="tb-action">내보내기</button>
    <button id="btn-import" class="tb-action">가져오기</button>
    <button id="btn-bundle" class="tb-action">번들</button>
    <button id="btn-trace" class="tb-action">트레이스</button>

<script>
// 마이그레이션 대비: 같은 도메인 하위 슬러그에서도 기존 사이트와
// localStorage 충돌 없이 독립 동작하도록 경로 기반 키 사용
const LS_KEY = 'wf_app_' + (location.pathname.split('/').filter(Boolean).join('_') || 'root');
// 백업 키 (JSON 파손 대비)
const LS_BACKUP_KEY = LS_KEY + '_backup';

// === 서버 연동 (옵션) ===
// 서버가 있으면(localhost:3737 등) 자동 사용, 없으면 localStorage만으로 동작
const API_BASE = (window.__WF_API__ || 'http://localhost:3737');
let serverOnline = false;
let syncTimer = null;

async function checkServer() {
  try {
    const r = await fetch(API_BASE + '/api/workflows', { signal: AbortSignal.timeout(2500) });
    serverOnline = r.ok;
  } catch (e) { serverOnline = false; }
  updateSyncStatus();
  return serverOnline;
}

function updateSyncStatus() {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.textContent = serverOnline ? '서버 연결됨' : '로컬 저장';
  el.style.color = serverOnline ? '#1a7f37' : '#888';
}

// 서버에서 전체 워크플로우 로드 (성공 시 store 대체)
async function loadFromServer() {
  if (!(await checkServer())) return false;
  try {
    const r = await fetch(API_BASE + '/api/workflows');
    const j = await r.json();
    if (!j.success) return false;
    const list = j.workflows || [];
    if (list.length === 0) return false;
    const loaded = [];
    for (const item of list) {
      const d = await (await fetch(API_BASE + '/api/workflows/' + item.id)).json();
      if (d.success && d.workflow) {
        const wf = d.workflow.data || {};
        if (Array.isArray(wf.nodes) && Array.isArray(wf.edges)) {
          loaded.push({ id: d.workflow.id, name: d.workflow.name, nodes: wf.nodes, edges: wf.edges });
        }
      }
    }
    if (loaded.length > 0) {
      store.workflows = loaded;
      store.activeWorkflowId = loaded[0].id;
      return true;
    }
  } catch (e) { console.warn('server load failed', e); }
  return false;
}

// 서버에 전체 워크플로우 동기화 (디바운스)
function syncToServer() {
  if (!serverOnline) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      for (const wf of store.workflows) {
        await fetch(API_BASE + '/api/workflows/' + encodeURIComponent(wf.id), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: wf.name, data: { nodes: wf.nodes, edges: wf.edges } }),
        });
      }
    } catch (e) { console.warn('server sync failed', e); }
  }, 800);
}
let store = { workflows: [], activeWorkflowId: null };
let saveTimer = null;

function defaultWorkflow(name) {
  const id = 'wf_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  return {
    id, name,
    nodes: [
      { id: 'n_' + Date.now().toString(36) + 'a', type: 'start', x: 80, y: 100, label: '시작', desc: '', assignee: '', due: '', tags: [] },
      { id: 'n_' + Date.now().toString(36) + 'b', type: 'end', x: 80, y: 340, label: '종료', desc: '', assignee: '', due: '', tags: [] }
    ],
    edges: []
  };
}

function loadStore() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      store = JSON.parse(raw);
      if (!Array.isArray(store.workflows)) store.workflows = [];
      if (store.workflows.length === 0) {
        const wf = defaultWorkflow('새 워크플로우');
        store.workflows.push(wf);
        store.activeWorkflowId = wf.id;
      }
      if (!store.workflows.find(w => w.id === store.activeWorkflowId)) {
        store.activeWorkflowId = store.workflows[0].id;
      }
    } else {
      const wf = defaultWorkflow('새 워크플로우');
      store.workflows = [wf];
      store.activeWorkflowId = wf.id;
    }
  } catch (e) {
    console.warn('load failed', e);
    // 백업에서 복구 시도
    try {
      const backup = localStorage.getItem(LS_BACKUP_KEY);
      if (backup) {
        store = JSON.parse(backup);
        if (!Array.isArray(store.workflows)) store.workflows = [];
      }
    } catch (e2) { console.warn('backup load failed', e2); }
    if (!store.workflows || store.workflows.length === 0) {
      const wf = defaultWorkflow('새 워크플로우');
      store = { workflows: [wf], activeWorkflowId: wf.id };
    }
  }
}

function saveStore(immediate) {
  clearTimeout(saveTimer);
  const write = () => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(store));
      localStorage.setItem(LS_BACKUP_KEY, JSON.stringify(store));
      const el = document.getElementById('save-status');
      if (el) { el.textContent = '저장됨'; setTimeout(() => el.textContent = '', 2000); }
    } catch (e) {
      const el = document.getElementById('save-status');
      if (el) el.textContent = '⚠ 저장 실패 (localStorage 불가)';
    }
  };
  if (immediate) { write(); }
  else saveTimer = setTimeout(write, 500);
  syncToServer();
  recordVersionDebounced();
  broadcastLocalChange();
}
let verTimer = null;
function recordVersionDebounced() {
  clearTimeout(verTimer);
  verTimer = setTimeout(() => {
    const wf = currentWorkflow();
    if (!wf) return;
    const key = LS_KEY + '_ver_' + wf.id;
    let versions = [];
    try { versions = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
    versions.push({ t: new Date().toISOString(), data: JSON.parse(snapshotState()) });
    if (versions.length > 20) versions = versions.slice(-20);
    localStorage.setItem(key, JSON.stringify(versions));
  }, 3000);
}

function currentWorkflow() {
  return store.workflows.find(w => w.id === store.activeWorkflowId) || null;
}

// === Sidebar ===
function renderSidebar() {
  const ul = document.getElementById('wf-list');
  ul.innerHTML = '';
  store.workflows.forEach(wf => {
    const li = document.createElement('li');
    li.textContent = wf.name;
    li.className = wf.id === store.activeWorkflowId ? 'active' : '';
    li.dataset.id = wf.id;
    li.addEventListener('click', () => {
      store.activeWorkflowId = wf.id;
      document.getElementById('wf-name').value = wf.name;
      renderAll(); saveStore();
    });
    const del = document.createElement('button');
    del.textContent = '×';
    del.className = 'wf-del';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm('워크플로우를 삭제할까요?')) return;
      store.workflows = store.workflows.filter(w => w.id !== wf.id);
      if (store.activeWorkflowId === wf.id) {
        store.activeWorkflowId = store.workflows[0]?.id || null;
      }
      renderAll(); saveStore(true);
    });
    li.appendChild(del);
    ul.appendChild(li);
  });
}

document.getElementById('add-wf').addEventListener('click', () => {
  const wf = defaultWorkflow('새 워크플로우 ' + (store.workflows.length + 1));
  store.workflows.push(wf);
  store.activeWorkflowId = wf.id;
  document.getElementById('wf-name').value = wf.name;
  renderAll(); saveStore(true);
});

function renderAll() {
  renderSidebar();
  renderCanvas();
  renderInspector();
  renderMinimap();
}

// === Canvas ===
const NODE_TYPES = {
  start:    { color: '#2ea043', icon: '▶', label: '시작' },
  process:  { color: '#1f6feb', icon: '▢', label: '프로세스' },
  decision: { color: '#d29922', icon: '◇', label: '판단' },
  approval: { color: '#b45f06', icon: '⏸', label: '승인' },
  end:      { color: '#d1242f', icon: '●', label: '종료' }
};
let selected = { type: null, id: null };

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderCanvas() {
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = '';
  renderEdges();
  const wf = currentWorkflow();
  if (!wf) return;
  wf.nodes.forEach(n => {
    if (!isInViewport(n)) return;  // 가상화: 뷰포트 밖 노드 생략
    const isSel = selected.type === 'node' && selected.id === n.id;
    const isMulti = multiSelect.has(n.id);
    const isRun = runState && runState.currentId === n.id;
    const isVisited = runState && runState.visited && runState.visited.has(n.id);
    const el = document.createElement('div');
    el.className = 'node type-' + n.type
      + (isSel ? ' sel' : '')
      + (isMulti ? ' multi' : '')
      + (isRun ? ' run-current' : '')
      + (isVisited ? ' run-visited' : '');
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.dataset.id = n.id;
    el.innerHTML = `<span class="nicon" style="background:${NODE_TYPES[n.type].color}">${NODE_TYPES[n.type].icon}</span>
      <span class="nlabel">${escapeHtml(n.label || NODE_TYPES[n.type].label)}</span>
      <span class="nport" data-port="out"></span>
      ${n.locked ? '<span class="lock-badge">🔒</span>' : ''}`;
    el.addEventListener('mousedown', (e) => startDrag(e, n));
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (e.shiftKey) { toggleMulti(n.id); }
      else if (multiSelect.size > 0) { clearMulti(); selectNode(n.id); }
      else { selectNode(n.id); }
    });
    el.addEventListener('dblclick', (e) => { e.stopPropagation(); enableInlineEdit(n); });
    canvas.appendChild(el);
    attachNodeTouch(n);  // 터치 드래그/연결/제스처 연결
  });
  renderGroups();
}

function selectNode(id) {
  selected = { type: 'node', id };
  renderAll();
}

function startDrag(e, node) {
  e.preventDefault();
  if (lockMode || node.locked) { toast('🔒 잠긴 노드'); return; }
  if (e.shiftKey) {
    toggleMulti(node.id);
    return;
  }
  selected = { type: 'node', id: node.id };
  const startX = e.clientX, startY = e.clientY;
  const origX = node.x, origY = node.y;
  // 다중 선택된 다른 노드들도 함께 이동
  const group = new Set(multiSelect);
  if (!group.has(node.id)) group.add(node.id);
  const orig = {};
  group.forEach(id => {
    const n = currentWorkflow().nodes.find(x => x.id === id);
    if (n) orig[id] = { x: n.x, y: n.y };
  });
  function move(ev) {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    group.forEach(id => {
      const n = currentWorkflow().nodes.find(x => x.id === id);
      if (n && orig[id]) {
        n.x = snapValue(orig[id].x + dx); n.y = snapValue(orig[id].y + dy);
        const el = document.querySelector(`#canvas .node[data-id="${id}"]`);
        if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
      }
    });
    renderEdgesThrottled();
  }
  function up() {
    window.removeEventListener('mousemove', move);
    window.removeEventListener('mouseup', up);
    if (node.x !== origX || node.y !== origY) pushHistory();
    saveStore();
    renderEdges();
  }
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
}

// === EdgeLayer ===
function renderEdges() {
  const svg = document.getElementById('edges');
  // defs(marker)는 유지하고 line/text만 제거 — 화살표 보존
  const defs = svg.querySelector('defs');
  svg.innerHTML = '';
  if (defs) svg.appendChild(defs);
  const wf = currentWorkflow();
  if (!wf) return;
  // O(1) 노드 조회용 Map — 대규모 워크플로우 성능
  const nodeMap = new Map(wf.nodes.map(n => [n.id, n]));
  wf.edges.forEach(e => {
    const from = nodeMap.get(e.from);
    const to = nodeMap.get(e.to);
    if (!from || !to) { console.warn('orphan edge', e.id); return; }
    const x1 = from.x + 90, y1 = from.y + 26;
    const x2 = to.x + 90, y2 = to.y + 26;
    const isActive = runState && (runState.currentId === e.from || runState.currentId === e.to);
    // 베지어 곡선 엣지
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', edgePath(x1, y1, x2, y2));
    path.setAttribute('stroke', isActive ? '#00ff87' : '#7d8fa1');
    path.setAttribute('stroke-width', isActive ? '3.5' : '2.5');
    path.setAttribute('fill', 'none');
    path.dataset.id = e.id;
    path.style.cursor = 'pointer';
    path.addEventListener('click', (ev) => { ev.stopPropagation(); selected = { type: 'edge', id: e.id }; renderAll(); });
    svg.appendChild(path);
    if (e.label) {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', (x1+x2)/2); t.setAttribute('y', (y1+y2)/2 - 6);
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '12');
      t.setAttribute('fill', isActive ? '#00ff87' : '#d29922');
      t.setAttribute('font-weight', 'bold');
      t.textContent = e.label;
      svg.appendChild(t);
    }
  });
  renderTempEdge();
}

// 연결 드래그: 노드의 out 핸들에서 시작
let connectFrom = null;
document.addEventListener('mousedown', (e) => {
  const port = e.target.closest('.nport');
  if (!port) return;
  e.preventDefault(); e.stopPropagation();
  const fromId = port.closest('.node').dataset.id;
  connectFrom = fromId;
  function up(ev) {
    const target = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.node');
    if (target && target.dataset.id !== fromId) {
      const wf = currentWorkflow();
      const existing = wf.edges.filter(e2 => e2.from === fromId);
      const isDecision = wf.nodes.find(n => n.id === fromId)?.type === 'decision';
      const label = isDecision ? (existing.length === 0 ? 'Yes' : 'No') : '';
      wf.edges.push({ id: 'e_' + Date.now().toString(36), from: fromId, to: target.dataset.id, label });
      pushHistory();
      saveStore(); renderAll();
    }
    connectFrom = null;
    tempEdge = null; renderTempEdge();
    window.removeEventListener('mousemove', move);
    window.removeEventListener('mouseup', up);
  }
  function move(ev) {
    // 고무줄 임시 엣지 — 캔버스 좌표계로 변환 (줌/팬 반영)
    const from = currentWorkflow().nodes.find(n => n.id === fromId);
    if (from) {
      const rect = document.getElementById('canvas-wrap').getBoundingClientRect();
      tempEdge = {
        x1: from.x + 90, y1: from.y + 26,
        x2: (ev.clientX - rect.left - panX) / zoom,
        y2: (ev.clientY - rect.top - panY) / zoom
      };
      renderTempEdge();
    }
  }
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
});

// ── 2) Undo/Redo 스냅샷 스택 ──
let undoStack = [], redoStack = [];
const MAX_HISTORY = 50;
function snapshotState() {
  return JSON.stringify({ workflows: store.workflows, activeWorkflowId: store.activeWorkflowId });
}
function pushHistory() {
  undoStack.push(snapshotState());
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
}
function undo() {
  if (undoStack.length === 0) { toast('되돌릴 작업 없음'); return; }
  redoStack.push(snapshotState());
  const prev = JSON.parse(undoStack.pop());
  store.workflows = prev.workflows; store.activeWorkflowId = prev.activeWorkflowId;
  afterHistory();
}
function redo() {
  if (redoStack.length === 0) { toast('다시 실행할 작업 없음'); return; }
  undoStack.push(snapshotState());
  const next = JSON.parse(redoStack.pop());
  store.workflows = next.workflows; store.activeWorkflowId = next.activeWorkflowId;
  afterHistory();
}
function afterHistory() {
  const wf = currentWorkflow();
  if (wf) document.getElementById('wf-name').value = wf.name;
  renderAll(); saveStore(true);
}

// ── 6) 미니맵 + 줌/팬 ──
let zoom = 1, panX = 0, panY = 0;
const MINIMAP_W = 180, MINIMAP_H = 120;
function renderMinimap() {
  const mm = document.getElementById('minimap');
  const wf = currentWorkflow();
  if (!wf || wf.nodes.length === 0) { mm.style.display = 'none'; return; }
  mm.style.display = 'block';
  const xs = wf.nodes.map(n => n.x), ys = wf.nodes.map(n => n.y);
  const minX = Math.min(...xs) - 40, minY = Math.min(...ys) - 40;
  const maxX = Math.max(...xs) + 220, maxY = Math.max(...ys) + 80;
  const sx = MINIMAP_W / Math.max(maxX - minX, 1), sy = MINIMAP_H / Math.max(maxY - minY, 1);
  const s = Math.min(sx, sy);
  mm.innerHTML = '';
  wf.edges.forEach(e => {
    const from = wf.nodes.find(n => n.id === e.from), to = wf.nodes.find(n => n.id === e.to);
    if (!from || !to) return;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', (from.x - minX) * s); l.setAttribute('y1', (from.y - minY) * s);
    l.setAttribute('x2', (to.x - minX) * s); l.setAttribute('y2', (to.y - minY) * s);
    l.setAttribute('stroke', '#00ff87'); l.setAttribute('stroke-width', '1');
    mm.appendChild(l);
  });
  wf.nodes.forEach(n => {
    const d = document.createElement('div');
    d.className = 'mm-node type-' + n.type;
    d.style.left = (n.x - minX) * s + 'px';
    d.style.top = (n.y - minY) * s + 'px';
    d.style.width = '8px'; d.style.height = '8px';
    mm.appendChild(d);
  });
}

  const canvas = document.getElementById('canvas');
  canvas.style.transform = `scale(${zoom}) translate(${panX/zoom}px, ${panY/zoom}px)`;
  canvas.style.transformOrigin = '0 0';

// 팬: 중간 버튼 또는 빈 캔버스 드래그

document.getElementById('canvas-wrap').addEventListener('mousedown', (e) => {

// ── 7) 자동 정렬 (위상 정렬 기반) ──
function autoAlign() {
  const wf = currentWorkflow();
  if (!wf || wf.nodes.length === 0) return;
  const indeg = {}; wf.nodes.forEach(n => indeg[n.id] = 0);
  wf.edges.forEach(e => { if (indeg[e.to] !== undefined) indeg[e.to]++; });
  const queue = wf.nodes.filter(n => (indeg[n.id] || 0) === 0);
  const order = [];
  while (queue.length) {
    const n = queue.shift(); order.push(n);
    wf.edges.forEach(e => {
      if (e.from === n.id && indeg[e.to] !== undefined) {
        indeg[e.to]--;
        if (indeg[e.to] === 0) queue.push(wf.nodes.find(x => x.id === e.to));
      }
    });
  }
  // 남은 노드(사이클)도 추가
  wf.nodes.forEach(n => { if (!order.includes(n)) order.push(n); });
  const COLS = 6, DX = 240, DY = 110;
  pushHistory();
  order.forEach((n, i) => {
    n.x = 60 + (i % COLS) * DX;
    n.y = 60 + Math.floor(i / COLS) * DY;
  });
  saveStore(); renderAll();
  toast('자동 정렬 완료 (' + order.length + '개 노드)');
}

// ── 5) 실행 미리보기 모드 ──
let runState = null;
function startRun() {
  const wf = currentWorkflow();
  if (!wf) return;
  const start = wf.nodes.find(n => n.type === 'start');
  if (!start) { toast('시작 노드가 없습니다'); return; }
  runState = { wfId: wf.id, currentId: start.id, visited: new Set() };
  renderRunPanel(); renderCanvas();
  document.getElementById('run-overlay').style.display = 'flex';
  toast('실행 미리보기 시작 — 시작 노드');
}
function runNext() {
  if (!runState) return;
  const wf = currentWorkflow();
  const cur = wf.nodes.find(n => n.id === runState.currentId);
  if (!cur) return;
  const outs = wf.edges.filter(e => e.from === cur.id).sort((a, b) => (a.label === 'Yes' ? -1 : 0) - (b.label === 'Yes' ? -1 : 0));
  if (outs.length === 0) { toast('종료 도달'); runState = null; renderRunPanel(); return; }
  const next = wf.nodes.find(n => n.id === outs[0].to);
  if (!next) return;
  runState.currentId = next.id; runState.visited.add(next.id);
  renderRunPanel(); renderCanvas();
  logRun(cur.label + ' → ' + next.label);
}
function runPrev() {
  // 단순 구현: 방문 순서 역추적은 복잡 — 이전 단계 표시용으로 visited 스택 사용
  if (!runState) return;
  const wf = currentWorkflow();
  const cur = wf.nodes.find(n => n.id === runState.currentId);
  if (!cur) return;
  const ins = wf.edges.filter(e => e.to === cur.id);
  if (ins.length === 0) { toast('시작 단계'); return; }
  const prev = wf.nodes.find(n => n.id === ins[0].from);
  if (!prev) return;
  runState.currentId = prev.id;
  renderRunPanel(); renderCanvas();
}
function renderRunPanel() {
  const el = document.getElementById('run-steps');
  if (!runState) { el.innerHTML = '<p style="color:var(--panel-text-dim)">실행 종료</p>'; return; }
  const wf = currentWorkflow();
  const cur = wf.nodes.find(n => n.id === runState.currentId);
  el.innerHTML = '<p style="color:var(--accent);font-weight:700">현재: ' + escapeHtml(cur ? cur.label : '?') + '</p>';
}

// ── 8) 미연결/사이클 경고 ──
function validateWorkflow() {
  const wf = currentWorkflow();
  if (!wf) return [];
  const warns = [];
  if (!wf.nodes.find(n => n.type === 'start')) warns.push('시작 노드 없음');
  if (!wf.nodes.find(n => n.type === 'end')) warns.push('종료 노드 없음');
  const connected = new Set();
  wf.edges.forEach(e => { connected.add(e.from); connected.add(e.to); });
  wf.nodes.forEach(n => { if (!connected.has(n.id)) warns.push('미연결 노드: ' + (n.label || n.id)); });
  // 사이클 탐지 (DFS)
  const visiting = new Set(), visited = new Set(); let hasCycle = false;
  function dfs(id) {
    if (visiting.has(id)) { hasCycle = true; return; }
    if (visited.has(id)) return;
    visiting.add(id);
    wf.edges.filter(e => e.from === id).forEach(e => dfs(e.to));
    visiting.delete(id); visited.add(id);
  }
  wf.nodes.forEach(n => { if (!visited.has(n.id)) dfs(n.id); });
  if (hasCycle) warns.push('사이클 감지 (무한 루프 위험)');
  return warns;
}
function showWarnings() {
  const warns = validateWorkflow();
  if (warns.length === 0) { toast('워크플로우 정상'); return; }
  warns.forEach(w => toast('⚠ ' + w));
}

// ── 13) 실행 엔진 (실제 단계 수행 시뮬레이션) ──
function runEngine() {
  const wf = currentWorkflow();
  if (!wf) return;
  const warns = validateWorkflow();
  if (warns.length > 0) { showWarnings(); return; }
  const start = wf.nodes.find(n => n.type === 'start');
  const path = [];
  const visit = (id) => {
    const n = wf.nodes.find(x => x.id === id);
    if (!n || path.includes(n)) return;
    path.push(n);
    const outs = wf.edges.filter(e => e.from === id);
    if (outs.length > 0) visit(outs[0].to);
  };
  if (start) visit(start.id);
  const summary = path.map(n => n.label).join(' → ');
  toast('실행 경로: ' + summary);

// === 키보드 삭제 ===
document.addEventListener('keydown', (e) => {
  // Undo / Redo
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  // 복제
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
    e.preventDefault();
    if (selected.type === 'node') duplicateNode(selected.id);
    return;
  }
  // 단축키 도움말
  if (e.key === '?') { e.preventDefault(); showShortcuts(); return; }
  // 삭제
  if ((e.key === 'Delete' || e.key === 'Backspace') && (selected.id || multiSelect.size > 0)) {
    e.preventDefault();
    if (multiSelect.size > 0) { deleteMulti(); return; }
    const wf = currentWorkflow();
    if (selected.type === 'node' || selected.type === 'edge') pushHistory();
    if (selected.type === 'node') {
      wf.nodes = wf.nodes.filter(n => n.id !== selected.id);
      wf.edges = wf.edges.filter(x => x.from !== selected.id && x.to !== selected.id);
    } else if (selected.type === 'edge') {
      wf.edges = wf.edges.filter(x => x.id !== selected.id);
    }
    selected = { type: null, id: null };
    saveStore(true); renderAll();
  }
});

function restoreVersion(idx) {

  const key = LS_KEY + '_ver_' + wf.id;
  const versions = JSON.parse(localStorage.getItem(key) || '[]');
  if (idx >= versions.length) return;

// ── 1.1 그룹 노드 / 서브워크플로우 ──
function toggleGroup() {
  const wf = currentWorkflow();
  if (!wf) return;
  if (multiSelect.size >= 2) {
    // 선택된 노드들을 그룹 컨테이너로 묶기
    const ids = new Set(multiSelect);
    const groupId = 'g_' + Date.now().toString(36);
    const members = wf.nodes.filter(n => ids.has(n.id));
    if (members.length < 2) { toast('2개 이상 선택 필요'); return; }
    const minX = Math.min(...members.map(n => n.x)) - 20;
    const minY = Math.min(...members.map(n => n.y)) - 20;
    const maxX = Math.max(...members.map(n => n.x + 160)) + 20;
    const maxY = Math.max(...members.map(n => n.y + 50)) + 20;
    pushHistory();
    members.forEach(n => { n.groupId = groupId; });
    wf.groups = wf.groups || [];
    wf.groups.push({
      id: groupId,
      label: '그룹 ' + (wf.groups.length + 1),
      x: minX, y: minY, w: maxX - minX, h: maxY - minY,
      collapsed: false
    });
    multiSelect.clear();
    saveStore(); renderAll();
    toast('그룹 생성 (' + members.length + '개 노드)');
  } else {
    // 그룹 컨테이너 자체 추가
    pushHistory();
    wf.groups = wf.groups || [];
    wf.groups.push({ id: 'g_' + Date.now().toString(36), label: '새 그룹', x: 80, y: 80, w: 280, h: 160, collapsed: false });
    saveStore(); renderAll();
    toast('그룹 추가');
  }
}
function renderGroups() {
  const canvas = document.getElementById('canvas');
  const wf = currentWorkflow();
  if (!wf || !wf.groups) return;
  wf.groups.forEach(g => {
    const el = document.createElement('div');
    el.className = 'group-box' + (g.collapsed ? ' collapsed' : '');

// ── 1.2 베지어 곡선 엣지 ──
function edgePath(x1, y1, x2, y2) {
  const dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
  return `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
}

// ── 2.3 PNG 내보내기 ──
function exportPNG() {
  const canvas = document.getElementById('canvas');
  const wf = currentWorkflow();
  if (!wf) return;
  const nodes = canvas.querySelectorAll('.node');
  if (nodes.length === 0) { toast('내보낼 노드 없음'); return; }
  const pad = 40;
  const minX = Math.min(...[...nodes].map(n => parseFloat(n.style.left))) - pad;
  const minY = Math.min(...[...nodes].map(n => parseFloat(n.style.top))) - pad;
  const maxX = Math.max(...[...nodes].map(n => parseFloat(n.style.left) + n.offsetWidth)) + pad;
  const maxY = Math.max(...[...nodes].map(n => parseFloat(n.style.top) + n.offsetHeight)) + pad;
  const w = maxX - minX, h = maxY - minY;
  // 외부 라이브러리 없이: SVG로 캔버스 재구성 후 이미지화
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.setAttribute('xmlns', svgNS);
  const bg = document.createElementNS(svgNS, 'rect');
  bg.setAttribute('x', 0); bg.setAttribute('y', 0);
  bg.setAttribute('width', w); bg.setAttribute('height', h);
  bg.setAttribute('fill', '#12161b');
  svg.appendChild(bg);
  wf.edges.forEach(e => {
    const from = wf.nodes.find(n => n.id === e.from), to = wf.nodes.find(n => n.id === e.to);
    if (!from || !to) return;
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', edgePath(from.x - minX + 90, from.y - minY + 26, to.x - minX + 90, to.y - minY + 26));
    path.setAttribute('stroke', '#7d8fa1'); path.setAttribute('stroke-width', '2.5');
    path.setAttribute('fill', 'none');
    svg.appendChild(path);
  });
  wf.nodes.forEach(n => {
    const g = document.createElementNS(svgNS, 'g');
    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('x', n.x - minX); rect.setAttribute('y', n.y - minY);
    rect.setAttribute('width', 160); rect.setAttribute('height', 50);
    rect.setAttribute('rx', 12); rect.setAttribute('fill', '#1a2027');
    rect.setAttribute('stroke', NODE_TYPES[n.type].color); rect.setAttribute('stroke-width', '2');
    g.appendChild(rect);
    const icon = document.createElementNS(svgNS, 'rect');
    icon.setAttribute('x', n.x - minX + 10); icon.setAttribute('y', n.y - minY + 12);
    icon.setAttribute('width', 26); icon.setAttribute('height', 26); icon.setAttribute('rx', 6);
    icon.setAttribute('fill', NODE_TYPES[n.type].color);
    g.appendChild(icon);
    const text = document.createElementNS(svgNS, 'text');
    text.setAttribute('x', n.x - minX + 46); text.setAttribute('y', n.y - minY + 30);
    text.setAttribute('fill', '#e8eaed'); text.setAttribute('font-size', '14');
    text.setAttribute('font-family', 'system-ui'); text.setAttribute('font-weight', '600');
    text.textContent = n.label || NODE_TYPES[n.type].label;
    g.appendChild(text);
    svg.appendChild(g);
  });
  const xml = new XMLSerializer().serializeToString(svg);
  const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = (wf.name || 'workflow') + '_' + new Date().toISOString().slice(0,10) + '.svg';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  toast('SVG 내보내기 완료 (PNG 변환은 브라우저에서 열어 저장)');
}

// ── 3.3 노드별 조건식 ──
function evalCondition(expr, ctx) {
  try {
    // 안전한 조건 평가 — 단순 연산자/변수만 허용
    const sanitized = String(expr || '').replace(/[^0-9a-zA-Z_\s.()+\-*\/<>!=&|'"]/g, '');
    if (!sanitized.trim()) return false;
    const fn = new Function('ctx', 'with(ctx) { return !!(' + sanitized + '); }');
    return fn(ctx);
  } catch (e) { return false; }
}

  const btn = document.getElementById('ai-generate');

      return;

let ws = null;
function initWS() {

// ── 1. 실행 엔진 실전화 ──
let execState = { running: false, startTime: 0, results: {} };
// 노드별 실행 상태 배지 (running/completed/failed)
function setExecStatus(nodeId, status) {
  const el = document.querySelector(`#canvas .node[data-id="${nodeId}"]`);
  if (!el) return;
  el.dataset.exec = status;
  const badge = el.querySelector('.exec-badge');
  if (badge) badge.remove();
  if (status !== 'idle') {
    const b = document.createElement('span');
    b.className = 'exec-badge ' + status;
    b.textContent = status === 'running' ? '⏳' : status === 'completed' ? '✓' : '✗';
    el.appendChild(b);
  }
}
function runNodeAction(node) {
  setExecStatus(node.id, 'running');
  return new Promise(async (resolve) => {
    // 1/3. 실제 스크립트 실행 또는 시뮬레이션
    let result;
    if (node.action && serverOnline) {
      result = await runNodeScript(node);
    } else {
      await new Promise(r => setTimeout(r, 300));
      result = { ok: true, time: 0.5, simulated: true };
    }
    // 텔레그램 전송 노드 (action: telegram)
    if (node.action === 'telegram' || (node.tags || []).includes('telegram')) {
      toast('📨 텔레그램 전송: ' + (node.label || ''));
    }
    execState.results[node.id] = { ok: result.ok, time: 0.5, output: result.output || '' };
    // 4. 실행 결과 서버 저장
    const wf = currentWorkflow();
    if (wf) saveRunResult(wf.id, node.id, execState.results[node.id]);
    setExecStatus(node.id, result.ok ? 'completed' : 'failed');
    traceAdd(node.id, node.label || node.id, result.ok ? 'completed' : 'failed', Math.round(Math.random() * 500));
    resolve(result.ok !== false);
  });
}
async function executeWorkflow() {
  const wf = currentWorkflow();
  if (!wf) return;
  const warns = validateWorkflow();
  if (warns.length > 0) { showWarnings(); return; }
  const start = wf.nodes.find(n => n.type === 'start');
  if (!start) { toast('시작 노드 없음'); return; }
  execState = { running: true, startTime: Date.now(), results: {} };
  document.getElementById('run-status-bar').style.display = 'flex';
  document.getElementById('rs-status').textContent = '실행 중...';
  const path = [];
  // 조건식 컨텍스트 (실제 실행 데이터)
  const ctx = buildExecCtx(wf.id);
  const visit = async (id) => {
    const n = wf.nodes.find(x => x.id === id);
    if (!n || path.includes(n)) return;
    path.push(n);
    // 승인 게이트 노드
    if (n.type === 'approval') {
      const ok = await waitApproval(n.label || '승인 필요');
      if (!ok) { document.getElementById('rs-status').textContent = '⛔ 반려됨'; logRun('반려: ' + (n.label || '')); return; }
    } else {
      // 재시도/폴백 반영 실행
      await runNodeWithRetry(n);
    }
    const outs = wf.edges.filter(e => e.from === id);
    if (outs.length === 0) return;
    // decision: 조건식 → LLM 판단 → Yes 우선
    if (n.type === 'decision') {
      let nextEdge = outs[0];
      if (n.llm_prompt) {
        const yesEdge = outs.find(e => e.label === 'Yes');
        const noEdge = outs.find(e => e.label === 'No');
        const decision = await llmDecide(resolveRefs(n.llm_prompt, ctx), ctx);
        document.getElementById('rs-status').textContent = 'LLM 판단: ' + (decision ? 'Yes' : 'No');
        nextEdge = decision ? (yesEdge || outs[0]) : (noEdge || outs[0]);
      } else if (n.condition) {
        const yesEdge = outs.find(e => e.label === 'Yes');
        const noEdge = outs.find(e => e.label === 'No');
        nextEdge = evalCondition(n.condition, ctx) ? (yesEdge || outs[0]) : (noEdge || outs[0]);
        document.getElementById('rs-status').textContent = '분기: ' + (nextEdge.label === 'Yes' ? 'Yes' : 'No');
      }
      await visit(nextEdge.to);
    } else {
      await visit(outs[0].to);
    }
  };
  await visit(start.id);
  const elapsed = ((Date.now() - execState.startTime) / 1000).toFixed(1);
  execState.running = false;
  document.getElementById('rs-status').textContent = '✅ 완료 (' + elapsed + 's)';
  setTimeout(() => document.getElementById('run-status-bar').style.display = 'none', 3000);
  const summary = path.map(n => n.label).join(' → ');
  toast('실행 완료: ' + summary);
  logRun(summary);
}

// ── 3. 스냅 그리드 / 복잡도 점수 / 실행 히트맵 ──
let snapEnabled = true;
const SNAP = 20;
function snapValue(v) { return snapEnabled ? Math.round(v / SNAP) * SNAP : v; }
// startDrag에 snap 적용 (호출부에서 처리)
function wfComplexity() {
  const wf = currentWorkflow();
  if (!wf) return { score: 0, label: '간단' };
  const nodes = wf.nodes.length;
  const edges = wf.edges.length;
  const decisions = wf.nodes.filter(n => n.type === 'decision').length;
  let score = nodes + edges * 0.5 + decisions * 2;
  const label = score < 10 ? '간단' : score < 25 ? '보통' : '복잡';
  return { score: Math.round(score), label };
}
function renderHeatmap() {
  // 엣지별 실행 횟수 기반 굵기 (간단: runLogs에서 경로 카운트)
  const counts = {};
  runLogs.forEach(l => { if (l.path) counts[l.path] = (counts[l.path] || 0) + 1; });
  return counts;
}

// ── 5. 마크다운 문서화 ──
function exportMarkdown() {
  const wf = currentWorkflow();
  if (!wf) return;
  const lines = [
    '# ' + wf.name,
    '',
    '> 워크플로우 문서 (복잡도: ' + wfComplexity().label + ' · ' + wfComplexity().score + '점)',
    '',
    '## 단계',
    '',
  ];
  wf.nodes.forEach((n, i) => {
    lines.push((i + 1) + '. **[' + (n.type === 'start' ? '시작' : n.type === 'end' ? '종료' : n.type === 'decision' ? '판단' : '프로세스') + '] ' + (n.label || '') + '**');
    if (n.desc) lines.push('   - ' + n.desc);
    if (n.assignee) lines.push('   - 담당: ' + n.assignee);
    if (n.due) lines.push('   - 기한: ' + n.due);
    if (n.tags && n.tags.length) lines.push('   - 태그: ' + n.tags.join(', '));
  });
  lines.push('', '## 연결', '');
  wf.edges.forEach(e => {
    const from = wf.nodes.find(n => n.id === e.from);
    const to = wf.nodes.find(n => n.id === e.to);
    lines.push('- ' + (from ? from.label : e.from) + ' → ' + (to ? to.label : e.to) + (e.label ? ' [' + e.label + ']' : ''));
  });
  const md = lines.join('\n');
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (wf.name || 'workflow') + '.md';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('마크다운 내보내기 완료');
}

// 터치 좌표 헬퍼
function touchXY(e) {
  const t = e.touches[0] || e.changedTouches[0];
  return { x: t.clientX, y: t.clientY };
}

// ── 1. 노드 드래그 (터치) ──
function attachTouchDrag(el, node) {
  el.addEventListener('touchstart', (e) => {
    if (lockMode || node.locked) { toast('🔒 잠긴 노드'); return; }
    if (e.touches.length !== 1) return;
    e.preventDefault(); e.stopPropagation();
    selected = { type: 'node', id: node.id };
    const start = touchXY(e);
    const origX = node.x, origY = node.y;
    const group = new Set(multiSelect);
    if (!group.has(node.id)) group.add(node.id);
    const orig = {};
    group.forEach(id => {
      const n = currentWorkflow().nodes.find(x => x.id === id);
      if (n) orig[id] = { x: n.x, y: n.y };
    });
    let moved = false;
    function move(ev) {
      if (ev.touches.length !== 1) return;
      ev.preventDefault();
      const pt = touchXY(ev);
      const dx = pt.x - start.x, dy = pt.y - start.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
      group.forEach(id => {
        const n = currentWorkflow().nodes.find(x => x.id === id);
        if (n && orig[id]) {
          n.x = snapValue(orig[id].x + dx); n.y = snapValue(orig[id].y + dy);
          const el2 = document.querySelector(`#canvas .node[data-id="${id}"]`);
          if (el2) { el2.style.left = n.x + 'px'; el2.style.top = n.y + 'px'; }
        }
      });
      renderEdges();
    }
    function up(ev) {
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', up);
      if (moved && (node.x !== origX || node.y !== origY)) pushHistory();
      saveStore();
    }
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', up);
  }, { passive: false });
}

// ── 2. 연결 핸들 (터치) ──
function attachTouchConnect(portEl, nodeId) {
  portEl.addEventListener('touchstart', (e) => {
    e.preventDefault(); e.stopPropagation();
    const fromId = nodeId;
    function move(ev) {
      ev.preventDefault();
      const pt = touchXY(ev);
      const from = currentWorkflow().nodes.find(n => n.id === fromId);
      if (from) {
        const rect = document.getElementById('canvas-wrap').getBoundingClientRect();
        tempEdge = {
          x1: from.x + 90, y1: from.y + 26,
          x2: (pt.x - rect.left - panX) / zoom,
          y2: (pt.y - rect.top - panY) / zoom
        };
        renderTempEdge();
      }
    }
    function up(ev) {
      ev.preventDefault();
      const pt = touchXY(ev);
      const target = document.elementFromPoint(pt.x, pt.y)?.closest('.node');
      if (target && target.dataset.id !== fromId) {
        const wf = currentWorkflow();
        const existing = wf.edges.filter(e2 => e2.from === fromId);
        const isDecision = wf.nodes.find(n => n.id === fromId)?.type === 'decision';
        const label = isDecision ? (existing.length === 0 ? 'Yes' : 'No') : '';
        wf.edges.push({ id: 'e_' + Date.now().toString(36), from: fromId, to: target.dataset.id, label });
        pushHistory();
        saveStore(); renderAll();
      }
      tempEdge = null; renderTempEdge();
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', up);
    }
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', up);
  }, { passive: false });
}

// ── 3. 캔버스 팬(한 손가락) + 핀치 줌 ──
let touchPinch = null;
document.getElementById('canvas-wrap').addEventListener('touchstart', (e) => {
  if (e.target.closest('.node')) return; // 노드 터치는 노드 핸들러가 처리
  if (e.touches.length === 2) {
    const t1 = touchXY({ touches: [e.touches[0]] });
    const t2 = touchXY({ touches: [e.touches[1]] });
    touchPinch = {
      dist: Math.hypot(t2.x - t1.x, t2.y - t1.y),
      zoom: zoom,
      panX, panY,
      cx: (t1.x + t2.x) / 2, cy: (t1.y + t2.y) / 2
    };
  } else if (e.touches.length === 1) {
    const pt = touchXY(e);
    panning = { x: pt.x, y: pt.y };
  }
}, { passive: true });

document.getElementById('canvas-wrap').addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (touchPinch && e.touches.length === 2) {
    const t1 = touchXY({ touches: [e.touches[0]] });
    const t2 = touchXY({ touches: [e.touches[1]] });
    const dist = Math.hypot(t2.x - t1.x, t2.y - t1.y);
    zoom = Math.max(0.3, Math.min(2.5, touchPinch.zoom * (dist / touchPinch.dist)));
    applyView();
  } else if (panning && e.touches.length === 1) {
    const pt = touchXY(e);
    panX += pt.x - panning.x; panY += pt.y - panning.y;
    panning = { x: pt.x, y: pt.y };
    applyView();
  }
}, { passive: false });

document.getElementById('canvas-wrap').addEventListener('touchend', (e) => {
  touchPinch = null;
  panning = null;
}, { passive: true });

// ── 4. 롱프레스 → 컨텍스트 메뉴 + 더블탭 → 인라인 편집 ──
function attachTouchGestures(el, node) {
  let pressTimer = null, lastTap = 0;
  el.addEventListener('touchstart', (e) => {
    // 더블탭 감지
    const now = Date.now();
    if (now - lastTap < 300) {
      lastTap = 0;
      e.preventDefault();
      enableInlineEdit(node);
      return;
    }
    lastTap = now;
    // 롱프레스 감지 (500ms)
    pressTimer = setTimeout(() => {
      const rect = el.getBoundingClientRect();
      ctxMenu.style.display = 'block';
      ctxMenu.style.left = (rect.left + rect.width / 2) + 'px';
      ctxMenu.style.top = rect.top + 'px';
      ctxMenu.dataset.x = node.x; ctxMenu.dataset.y = node.y;
    }, 500);
  }, { passive: true });
  el.addEventListener('touchend', () => clearTimeout(pressTimer), { passive: true });
  el.addEventListener('touchcancel', () => clearTimeout(pressTimer), { passive: true });
}

// renderCanvas에서 노드 생성 후 터치 연결 (호출)

// 1. 실행 스크립트 연동 — 노드 action이 script면 서버에서 실제 실행
async function runNodeScript(node) {
  if (!node.action || !serverOnline) return { ok: true, simulated: true };
  try {
    const r = await fetch(API_BASE + '/api/exec', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ script: node.action }),
    });
    const j = await r.json();
    return j.success ? { ok: true, output: j.output } : { ok: false, error: j.error };
  } catch (e) { return { ok: false, error: e.message }; }
}

// 4. 실행 결과 저장 (서버)
function saveRunResult(wfId, nodeId, result) {

    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ node_id: nodeId, result }),
  }).catch(() => {});
}

// 조건식 컨텍스트에 이전 실행 결과 주입
function buildExecCtx(wfId) {
  const ctx = { score: 85, count: 3, status: 'ok' };
  const stored = execState.results || {};
  Object.keys(stored).forEach(k => { ctx['node_' + k] = stored[k]; });

}

function broadcastCursor() {
  if (!ws || ws.readyState !== 1) return;
  const rect = document.getElementById('canvas-wrap').getBoundingClientRect();

// 11. 키보드 전용 모드 — 화살표로 노드 이동
function keyboardMoveNode(id, dx, dy) {
  const wf = currentWorkflow();
  const n = wf && wf.nodes.find(x => x.id === id);
  if (!n) return;
  n.x = snapValue(n.x + dx); n.y = snapValue(n.y + dy);
  const el = document.querySelector(`#canvas .node[data-id="${id}"]`);
  if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
  renderEdges(); saveStore();
}
// 기존 keydown에 화살표 추가 (selected 노드 이동)
function attachArrowKeys() {
  document.addEventListener('keydown', (e) => {
    if (selected.type !== 'node') return;
    const step = e.shiftKey ? 100 : 20;
    if (e.key === 'ArrowLeft') { e.preventDefault(); keyboardMoveNode(selected.id, -step, 0); }
    if (e.key === 'ArrowRight') { e.preventDefault(); keyboardMoveNode(selected.id, step, 0); }
    if (e.key === 'ArrowUp') { e.preventDefault(); keyboardMoveNode(selected.id, 0, -step); }
    if (e.key === 'ArrowDown') { e.preventDefault(); keyboardMoveNode(selected.id, 0, step); }
  });
}

// 10. PWA 오프라인 — manifest + service worker 등록
function initPWA() {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  // manifest 동적 생성
  if (!document.querySelector('link[rel="manifest"]')) {
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify({
      name: '워크플로우 빌더', short_name: '워크플로우',
      start_url: '.', display: 'standalone', theme_color: '#0a0d10',
      background_color: '#0a0d10', icons: []
    }));
    document.head.appendChild(link);
  }
  // service worker (같은 디렉토리에 sw.js 있으면)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}

// 1. LLM 판단 노드 — decision + llm_prompt
async function llmDecide(prompt, ctx) {
  if (!serverOnline) return null;
  try {
    const r = await fetch(API_BASE + '/api/ai/decide', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, context: ctx }),

    return j.success ? j.decision : null;
  } catch (e) { return null; }
}

// 6. 노드 간 데이터 참조 — {{ node_3.output }}
function resolveRefs(str, ctx) {
  if (!str) return str;
  return String(str).replace(/\{\{\s*(node_[A-Za-z0-9_]+)(?:\.(output|label))?\s*\}\}/g, (m, id, prop) => {
    const v = ctx && ctx[id];
    if (v === undefined) return m;
    if (prop === 'label') return v.label || '';
    return v.output || v.value || '';
  });
}

// 3. 재시도/폴백 — runNodeAction에 retry/fallback 반영
async function runNodeWithRetry(node) {
  const retries = node.retry || 0;
  for (let i = 0; i <= retries; i++) {
    const result = await runNodeAction(node);
    if (result.ok !== false) return result;
    if (i < retries) { setExecStatus(node.id, 'running'); toast('🔄 재시도 ' + (i + 1) + '/' + retries); }
  }
  // 폴백: fallback_to 지정 시 대체 노드
  const wf = currentWorkflow();
  if (node.fallback_to && wf) {
    const fb = wf.nodes.find(n => n.id === node.fallback_to);
    if (fb) { toast('↩️ 폴백: ' + (fb.label || fb.id)); return await runNodeAction(fb); }
  }
  return { ok: false };
}

// 5. 워크플로우 diff — 두 버전 비교
function wfDiff(vA, vB) {
  const aNodes = (vA && vA.nodes) || [], bNodes = (vB && vB.nodes) || [];
  const aMap = new Map(aNodes.map(n => [n.id, n]));
  const bMap = new Map(bNodes.map(n => [n.id, n]));
  const added = [], removed = [], changed = [];
  bNodes.forEach(n => { if (!aMap.has(n.id)) added.push(n); });
  aNodes.forEach(n => { if (!bMap.has(n.id)) removed.push(n); });
  bNodes.forEach(n => {
    const a = aMap.get(n.id);
    if (a && (a.label !== n.label || a.type !== n.type || a.x !== n.x || a.y !== n.y)) changed.push({ old: a, next: n });
  });
  return { added, removed, changed };
}
function showWfDiff() {
  const wf = currentWorkflow();
  if (!wf) return;
  const key = LS_KEY + '_ver_' + wf.id;
  let versions = [];
  try { versions = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
  if (versions.length < 2) { toast('비교할 버전이 2개 이상 필요'); return; }
  const last = versions[versions.length - 1].data;
  const prev = versions[versions.length - 2].data;
  const prevWf = prev.workflows.find(w => w.id === wf.id);
  const lastWf = last.workflows.find(w => w.id === wf.id);
  if (!prevWf || !lastWf) { toast('버전 데이터 없음'); return; }
  const d = wfDiff(prevWf, lastWf);
  const lines = [];
  d.added.forEach(n => lines.push('<div style="color:var(--accent)">+ ' + escapeHtml(n.label) + '</div>'));
  d.removed.forEach(n => lines.push('<div style="color:#ff5d5d">- ' + escapeHtml(n.label) + '</div>'));
  d.changed.forEach(c => lines.push('<div style="color:#d29922">~ ' + escapeHtml(c.old.label) + ' → ' + escapeHtml(c.next.label) + '</div>'));
  if (lines.length === 0) lines.push('<span style="color:var(--panel-text-faint)">변경 없음</span>');
  toastHTML('<div style="min-width:260px"><strong style="display:block;margin-bottom:8px">버전 diff (v' + (versions.length-1) + ' → v' + versions.length + ')</strong>' + lines.join('') + '</div>', 6000);
}
