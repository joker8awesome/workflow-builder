<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>워크플로우 빌더</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#f5f6f8;color:#1a1a1a;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  #topbar{height:52px;background:#fff;border-bottom:1px solid #e2e4e8;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
  #app{flex:1;display:flex;min-height:0}
  #sidebar{width:240px;background:#fff;border-right:1px solid #e2e4e8;flex-shrink:0;display:flex;flex-direction:column}
  #canvas-wrap{flex:1;position:relative;overflow:hidden;background:#f5f6f8}
  #canvas{position:absolute;inset:0}
  #inspector{width:280px;background:#fff;border-left:1px solid #e2e4e8;flex-shrink:0;overflow-y:auto}
  @media(max-width:900px){#sidebar{position:absolute;z-index:10;height:100%;transform:translateX(-100%);transition:transform .2s}#sidebar.open{transform:none}#inspector{position:absolute;right:0;z-index:10;height:100%;transform:translateX(100%);transition:transform .2s}#inspector.open{transform:none}}
</style>
</head>
<body>
  <header id="topbar">
    <button id="sidebar-toggle">☰</button>
    <strong>워크플로우 빌더</strong>
    <input id="wf-name" placeholder="워크플로우 이름" style="flex:1;max-width:300px">
    <span id="save-status" style="font-size:12px;color:#888"></span>
  </header>
  <div id="app">
    <aside id="sidebar">
      <button id="add-wf">+ 새 워크플로우</button>
      <ul id="wf-list"></ul>
    </aside>
    <main id="canvas-wrap">
      <svg id="edges"></svg>
      <div id="canvas"></div>
    </main>
    <aside id="inspector">
      <h3>속성</h3>
      <div id="inspector-body"></div>
    </aside>
  </div>
<script>
const LS_KEY = 'wf_app_data';
let store = { workflows: [], activeWorkflowId: null };
let saveTimer = null;

function defaultWorkflow(name) {
  const id = 'wf_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  return {
    id, name,
    nodes: [
      { id: 'n_' + Date.now().toString(36) + 'a', type: 'start', x: 80, y: 100, label: '시작', desc: '', assignee: '', due: '', tags: [] },
      { id: 'n_' + Date.now().toString(36) + 'b', type: 'end', x: 80, y: 340, label: '종료', desc: '', assignee: '', due: '', tags: [] }
    ],
    edges: []
  };
}

function loadStore() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      store = JSON.parse(raw);
      if (!Array.isArray(store.workflows)) store.workflows = [];
      if (store.workflows.length === 0) {
        const wf = defaultWorkflow('새 워크플로우');
        store.workflows.push(wf);
        store.activeWorkflowId = wf.id;
      }
      if (!store.workflows.find(w => w.id === store.activeWorkflowId)) {
        store.activeWorkflowId = store.workflows[0].id;
      }
    } else {
      const wf = defaultWorkflow('새 워크플로우');
      store.workflows = [wf];
      store.activeWorkflowId = wf.id;
    }
  } catch (e) {
    console.warn('load failed', e);
    const wf = defaultWorkflow('새 워크플로우');
    store = { workflows: [wf], activeWorkflowId: wf.id };
  }
}

function saveStore(immediate) {
  clearTimeout(saveTimer);
  const write = () => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(store));
      const el = document.getElementById('save-status');
      if (el) { el.textContent = '저장됨'; setTimeout(() => el.textContent = '', 2000); }
    } catch (e) {
      const el = document.getElementById('save-status');
      if (el) el.textContent = '⚠ 저장 실패 (localStorage 불가)';
    }
  };
  if (immediate) write();
  else saveTimer = setTimeout(write, 500);
}

function currentWorkflow() {
  return store.workflows.find(w => w.id === store.activeWorkflowId) || null;
}

// 초기화
loadStore();
const wf0 = currentWorkflow();
if (wf0) document.getElementById('wf-name').value = wf0.name;
</script>
</body>
</html>
